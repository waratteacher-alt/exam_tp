<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบสอบออนไลน์</title>

    <!-- Tailwind CSS สำหรับการจัดการความสวยงาม (UI/UX) -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- FontAwesome สำหรับ Icons (ใช้แทน Lucide เพื่อให้ทำงานใน HTML หน้าเดียวได้สมบูรณ์) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- React & ReactDOM (UMD Build) -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    
    <!-- Babel สำหรับแปลง JSX เป็น JavaScript -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- Firebase SDK (Compat Version สำหรับ HTML หน้าเดียว) -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>

    <!-- Google Fonts: Sarabun (ฟอนต์มาตรฐานทางการ/ราชการ) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        html {
            /* ลดขนาดสัดส่วนของ UI ทั้งหมดลงเหลือ 70% */
            font-size: 70%; 
        }
        body { 
            /* ใช้ฟอนต์ Sarabun เพื่อความเป็นทางการ */
            font-family: 'Sarabun', Tahoma, sans-serif; 
            background-color: #f8fafc; 
        }
        /* ซ่อน Scrollbar แต่อยู่ในสถานะ Scroll ได้ */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // ---------------------------------------------------------
        // FIREBASE CONFIGURATION & INITIALIZATION
        // ---------------------------------------------------------
        const firebaseConfig = {
            apiKey: "AIzaSyACCbQAf5PkWe4J-IZoHF_8iF5Y4-kufw4",
            authDomain: "exam-tp-4339b.firebaseapp.com",
            projectId: "exam-tp-4339b",
            storageBucket: "exam-tp-4339b.firebasestorage.app",
            messagingSenderId: "698899405862",
            appId: "1:698899405862:web:1db255c6e8f324973a9ae7",
            measurementId: "G-N01SCQFTZP"
        };

        // Initialize Firebase
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();

        // ---------------------------------------------------------
        // STRICT COLLECTION LOCK (ล็อคค่าป้องกันการอ้างอิงผิด/แก้ชื่อ Collection)
        // ---------------------------------------------------------
        const COLLECTIONS = Object.freeze({
            USERS: 'exam_users',
            EXAMS: 'exam_exams',
            SESSIONS: 'exam_sessions',
            SUBMISSIONS: 'exam_submissions'
        });

        // ---------------------------------------------------------
        // API LAYER (Optimized Firestore Queries)
        // ---------------------------------------------------------
        const api = {
            login: async (username, password) => {
                const snapshot = await db.collection(COLLECTIONS.USERS)
                    .where('username', '==', username)
                    .where('password', '==', password)
                    .get();
                
                if (!snapshot.empty) {
                    const doc = snapshot.docs[0];
                    return { id: doc.id, ...doc.data() };
                }
                throw new Error('ชื่อผู้ใช้หรือรหัสผ่านไม่ถูกต้อง');
            },
            
            registerTeacher: async (teacherData) => {
                const snapshot = await db.collection(COLLECTIONS.USERS)
                    .where('username', '==', teacherData.username)
                    .get();
                    
                if (!snapshot.empty) {
                    throw new Error('รหัสผู้ใช้นี้มีในระบบแล้ว');
                }
                const newTeacher = {
                    username: teacherData.username,
                    password: teacherData.password,
                    name: teacherData.name,
                    role: 'teacher'
                };
                const docRef = await db.collection(COLLECTIONS.USERS).add(newTeacher);
                return { id: docRef.id, ...newTeacher };
            },

            getExams: async (userId, role) => {
                if (role === 'teacher') {
                    const snapshot = await db.collection(COLLECTIONS.EXAMS).get();
                    return snapshot.docs.map(d => ({ id: d.id, ...d.data() }));
                } else {
                    // ฝั่งนักเรียน: Query เฉพาะวิชาที่ตัวเองถูกมอบหมาย (array-contains)
                    const examsSnapshot = await db.collection(COLLECTIONS.EXAMS)
                        .where('allowedStudentIds', 'array-contains', userId)
                        .get();
                    const allowedExams = examsSnapshot.docs.map(d => ({ id: d.id, ...d.data() }));
                    
                    const sessionsSnapshot = await db.collection(COLLECTIONS.SESSIONS)
                        .where('userId', '==', userId)
                        .get();
                    const sessions = sessionsSnapshot.docs.map(d => ({ id: d.id, ...d.data() }));
                    
                    // เพื่อประสิทธิภาพในการโหลด Mockup ดึง submissions ทั้งหมดของ user คนนี้
                    const subsSnapshot = await db.collection(COLLECTIONS.SUBMISSIONS).get();
                    const allSubs = subsSnapshot.docs.map(d => ({ id: d.id, ...d.data() }));

                    return allowedExams.map(ex => {
                        const session = sessions.find(s => s.examId === ex.id);
                        const submission = session ? allSubs.find(sub => sub.sessionId === session.id) : null;
                        return { ...ex, session, submission };
                    });
                }
            },

            startSession: async (userId, examId) => {
                const snapshot = await db.collection(COLLECTIONS.SESSIONS)
                    .where('userId', '==', userId)
                    .where('examId', '==', examId)
                    .get();
                
                if (!snapshot.empty) {
                    const doc = snapshot.docs[0];
                    return { id: doc.id, ...doc.data() };
                }
                
                const examDoc = await db.collection(COLLECTIONS.EXAMS).doc(examId).get();
                const exam = { id: examDoc.id, ...examDoc.data() };
                
                const now = Date.now();
                const randomFileIndex = Math.floor(Math.random() * (exam.fileSets?.length || 1));
                const assignedFile = exam.fileSets && exam.fileSets.length > 0 ? exam.fileSets[randomFileIndex] : 'Default_Exam.pdf';

                const session = {
                    userId,
                    examId,
                    startTime: now,
                    endTime: now + (exam.durationMinutes * 60 * 1000),
                    assignedFile: assignedFile
                };
                
                const docRef = await db.collection(COLLECTIONS.SESSIONS).add(session);
                session.id = docRef.id;
                return session;
            },

            submitAnswer: async (sessionId, fileName) => {
                const sessionDoc = await db.collection(COLLECTIONS.SESSIONS).doc(sessionId).get();
                if (!sessionDoc.exists) throw new Error('ไม่พบข้อมูลการสอบ');
                const session = { id: sessionDoc.id, ...sessionDoc.data() };
                
                const serverTime = Date.now();
                const examDoc = await db.collection(COLLECTIONS.EXAMS).doc(session.examId).get();
                const exam = examDoc.data();
                
                const isLate = serverTime > session.endTime;

                if (isLate && !exam.allowLateSubmission) {
                    throw new Error('หมดเวลาส่งข้อสอบแล้ว ระบบปฏิเสธการรับไฟล์');
                }

                const submission = {
                    sessionId,
                    fileName,
                    submittedAt: serverTime,
                    isLate: isLate
                };
                const docRef = await db.collection(COLLECTIONS.SUBMISSIONS).add(submission);
                submission.id = docRef.id;
                return submission;
            },

            createExam: async (examData) => {
                const newExam = {
                    title: examData.title,
                    durationMinutes: examData.durationMinutes,
                    description: examData.description,
                    fileSets: examData.fileSets && examData.fileSets.length > 0 ? examData.fileSets : ['ExamFile_Default.pdf'],
                    allowLateSubmission: examData.allowLateSubmission,
                    allowedStudentIds: examData.allowedStudentIds || [] 
                };
                const docRef = await db.collection(COLLECTIONS.EXAMS).add(newExam);
                return { id: docRef.id, ...newExam };
            },

            getExamResults: async (examId) => {
                const examDoc = await db.collection(COLLECTIONS.EXAMS).doc(examId).get();
                const exam = examDoc.data();
                
                // ถ้ารายวิชานี้ไม่มีคนสอบเลย
                if (!exam.allowedStudentIds || exam.allowedStudentIds.length === 0) return [];

                // ดึงรายชื่อนักเรียนที่มีสิทธิ์สอบในวิชานี้
                const usersSnapshot = await db.collection(COLLECTIONS.USERS).where('role', '==', 'student').get();
                const allUsers = usersSnapshot.docs.map(d => ({ id: d.id, ...d.data() }));
                const allowedStudents = allUsers.filter(u => exam.allowedStudentIds.includes(u.id));
                
                const sessionsSnapshot = await db.collection(COLLECTIONS.SESSIONS).where('examId', '==', examId).get();
                const sessions = sessionsSnapshot.docs.map(d => ({ id: d.id, ...d.data() }));
                
                const subsSnapshot = await db.collection(COLLECTIONS.SUBMISSIONS).get();
                const allSubs = subsSnapshot.docs.map(d => ({ id: d.id, ...d.data() }));

                const results = allowedStudents.map(student => {
                    const session = sessions.find(s => s.userId === student.id);
                    const submission = session ? allSubs.find(sub => sub.sessionId === session.id) : null;
                    
                    let status = 'ยังไม่เริ่มสอบ';
                    if (session) {
                        if (submission) {
                            status = submission.isLate ? 'ส่งแล้ว (ล่าช้า)' : 'ส่งแล้ว';
                        } else if (Date.now() > session.endTime && !exam.allowLateSubmission) {
                            status = 'หมดเวลา/ไม่ส่ง';
                        } else if (Date.now() > session.endTime && exam.allowLateSubmission) {
                            status = 'หมดเวลา (รอดำเนินการส่งล่าช้า)';
                        } else {
                            status = 'กำลังทำข้อสอบ';
                        }
                    }

                    return {
                        studentId: student.username,
                        studentName: student.name,
                        grade: student.grade,
                        room: student.room,
                        startTime: session ? session.startTime : null,
                        assignedFile: session ? session.assignedFile : '-',
                        submission: submission || null,
                        status: status
                    };
                });
                return results;
            },

            getStudents: async () => {
                const snapshot = await db.collection(COLLECTIONS.USERS).where('role', '==', 'student').get();
                return snapshot.docs.map(d => ({ id: d.id, ...d.data() }));
            },

            addStudent: async (studentData) => {
                const snapshot = await db.collection(COLLECTIONS.USERS).where('username', '==', studentData.username).get();
                
                if (!snapshot.empty) {
                    throw new Error('รหัสผู้ใช้นี้มีในระบบแล้ว');
                }

                const newStudent = {
                    username: studentData.username,
                    password: studentData.password,
                    name: studentData.name,
                    role: 'student',
                    grade: studentData.grade,
                    room: studentData.room
                };
                const docRef = await db.collection(COLLECTIONS.USERS).add(newStudent);
                return { id: docRef.id, ...newStudent };
            },

            bulkAddStudents: async (studentsArray) => {
                // ดึงรายชื่อเก่ามาเช็คซ้ำ
                const snapshot = await db.collection(COLLECTIONS.USERS).get();
                const existingUsernames = new Set(snapshot.docs.map(d => d.data().username));

                const batch = db.batch();
                let addedCount = 0;
                let skippedCount = 0;

                studentsArray.forEach(student => {
                    if (existingUsernames.has(student.username)) {
                        skippedCount++;
                    } else {
                        const docRef = db.collection(COLLECTIONS.USERS).doc();
                        batch.set(docRef, {
                            username: String(student.username),
                            password: String(student.password),
                            name: String(student.name),
                            role: 'student',
                            grade: String(student.grade),
                            room: String(student.room)
                        });
                        existingUsernames.add(student.username); // กันซ้ำในล็อตเดียวกัน
                        addedCount++;
                    }
                });

                if (addedCount > 0) {
                    await batch.commit(); // บันทึกข้อมูลทั้งหมดรวดเดียว (Atomic Batch)
                }
                return { added: addedCount, skipped: skippedCount };
            }
        };

        // ---------------------------------------------------------
        // UI COMPONENTS
        // ---------------------------------------------------------

        const Notification = ({ message, type, onClose }) => {
            if (!message) return null;
            const bgColor = type === 'error' ? 'bg-rose-50 border-rose-500 text-rose-700' : 'bg-emerald-50 border-emerald-500 text-emerald-700';
            const IconClass = type === 'error' ? 'fa-solid fa-circle-exclamation' : 'fa-solid fa-circle-check';
            
            return (
                <div className={`fixed top-6 right-6 z-50 flex items-center p-4 border-l-4 rounded-xl shadow-xl transition-all duration-300 transform translate-y-0 ${bgColor}`}>
                    <i className={`${IconClass} text-xl mr-3`}></i>
                    <span className="font-medium">{message}</span>
                    <button onClick={onClose} className="ml-6 text-gray-400 hover:text-gray-600 focus:outline-none"><i className="fa-solid fa-xmark"></i></button>
                </div>
            );
        };

        const InstructionModal = ({ role, onAccept }) => {
            return (
                <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/60 backdrop-blur-sm">
                    <div className="bg-white rounded-2xl w-full max-w-lg p-8 shadow-2xl transform transition-all">
                        <div className="flex items-center justify-center w-16 h-16 rounded-full bg-blue-100 text-blue-600 mx-auto mb-6">
                            <i className="fa-solid fa-circle-info text-3xl"></i>
                        </div>
                        <h2 className="text-2xl font-bold text-center text-slate-800 mb-6">คำชี้แจงการใช้งานระบบ</h2>
                        
                        {role === 'student' ? (
                            <div className="space-y-4 text-slate-600 mb-8">
                                <div className="flex items-start">
                                    <i className="fa-solid fa-circle-check text-emerald-500 mr-3 mt-1 flex-shrink-0"></i>
                                    <p>ระบบจะเริ่มจับเวลา <span className="font-bold text-rose-500">ทันที</span> ที่คุณกดปุ่ม "ดาวน์โหลดข้อสอบ"</p>
                                </div>
                                <div className="flex items-start">
                                    <i className="fa-solid fa-circle-check text-emerald-500 mr-3 mt-1 flex-shrink-0"></i>
                                    <p>หากอินเทอร์เน็ตขัดข้อง สามารถล็อกอินเข้ามาทำต่อได้ (เวลาจะนับต่อเนื่องจากเซิร์ฟเวอร์หลัก)</p>
                                </div>
                                <div className="flex items-start">
                                    <i className="fa-solid fa-circle-check text-emerald-500 mr-3 mt-1 flex-shrink-0"></i>
                                    <p>ตรวจสอบไฟล์คำตอบให้ถูกต้องก่อนกดส่งทุกครั้ง</p>
                                </div>
                            </div>
                        ) : (
                            <div className="space-y-4 text-slate-600 mb-8">
                                <div className="flex items-start">
                                    <i className="fa-solid fa-circle-check text-indigo-500 mr-3 mt-1 flex-shrink-0"></i>
                                    <p>ผู้สอนต้องเพิ่มรายชื่อนักเรียนเข้าระบบกลาง ก่อนจึงจะสามารถกำหนดสิทธิ์เข้าสอบได้</p>
                                </div>
                                <div className="flex items-start">
                                    <i className="fa-solid fa-circle-check text-indigo-500 mr-3 mt-1 flex-shrink-0"></i>
                                    <p>สามารถอัปโหลดไฟล์ข้อสอบได้หลายชุด ระบบจะทำการสุ่มแจกให้นักเรียนอัตโนมัติ</p>
                                </div>
                                <div className="flex items-start">
                                    <i className="fa-solid fa-circle-check text-indigo-500 mr-3 mt-1 flex-shrink-0"></i>
                                    <p>ระบบเชื่อมต่อกับ Firebase เรียบร้อยแล้ว (การดัดแปลงจะถูกบันทึกจริง)</p>
                                </div>
                            </div>
                        )}

                        <button 
                            onClick={onAccept}
                            className="w-full py-4 rounded-xl text-white font-bold text-lg bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-700 hover:to-indigo-700 shadow-lg shadow-blue-500/30 transition-all active:scale-95"
                        >
                            ฉันรับทราบและเข้าใจแล้ว
                        </button>
                    </div>
                </div>
            );
        };

        const LoginView = ({ onLogin }) => {
            const [isRegistering, setIsRegistering] = useState(false);
            
            const [username, setUsername] = useState('');
            const [password, setPassword] = useState('');
            
            const [regName, setRegName] = useState('');
            const [regUsername, setRegUsername] = useState('');
            const [regPassword, setRegPassword] = useState('');
            
            const [isLoading, setIsLoading] = useState(false);
            const [error, setError] = useState('');

            const handleLoginSubmit = async (e) => {
                e.preventDefault();
                setIsLoading(true);
                setError('');
                try {
                    const user = await api.login(username, password);
                    onLogin(user);
                } catch (err) {
                    setError(err.message);
                } finally {
                    setIsLoading(false);
                }
            };

            const handleRegisterSubmit = async (e) => {
                e.preventDefault();
                setIsLoading(true);
                setError('');
                try {
                    await api.registerTeacher({ name: regName, username: regUsername, password: regPassword });
                    setIsRegistering(false);
                    setUsername(regUsername);
                    setPassword(regPassword);
                    setError('ลงทะเบียนครูผู้สอนสำเร็จ! กรุณาเข้าสู่ระบบ');
                } catch (err) {
                    setError(err.message);
                } finally {
                    setIsLoading(false);
                }
            };

            return (
                <div className="flex min-h-screen bg-slate-50 relative overflow-hidden">
                    <div className="absolute top-[-10%] left-[-10%] w-[40%] h-[40%] bg-blue-400/20 rounded-full blur-3xl"></div>
                    <div className="absolute bottom-[-10%] right-[-10%] w-[40%] h-[40%] bg-indigo-400/20 rounded-full blur-3xl"></div>
                    
                    <div className="flex flex-col justify-center items-center w-full z-10 px-4 py-8">
                        <div className="w-full max-w-md p-10 bg-white/80 backdrop-blur-xl rounded-3xl shadow-[0_8px_30px_rgb(0,0,0,0.04)] border border-white">
                            <div className="text-center mb-10">
                                <div className="inline-flex items-center justify-center w-20 h-20 bg-gradient-to-br from-blue-500 to-indigo-600 text-white rounded-2xl mb-6 shadow-lg shadow-blue-500/30 transform rotate-3">
                                    <i className="fa-solid fa-lock text-4xl -rotate-3"></i>
                                </div>
                                <h2 className="text-3xl font-extrabold text-slate-800 tracking-tight">ระบบสอบออนไลน์</h2>
                                <p className="text-slate-500 mt-3 font-medium">
                                    {isRegistering ? 'สร้างบัญชีผู้ดูแลระบบ (ครูผู้สอน)' : 'เข้าสู่ระบบเพื่อดำเนินการต่อ'}
                                </p>
                            </div>
                            
                            {error && (
                                <div className={`mb-6 p-4 text-sm font-medium rounded-xl flex items-center border ${error.includes('สำเร็จ') ? 'bg-emerald-50 text-emerald-600 border-emerald-100' : 'bg-rose-50 text-rose-600 border-rose-100'}`}>
                                    <i className={`fa-solid fa-circle-exclamation mr-2 flex-shrink-0`}></i>
                                    {error}
                                </div>
                            )}

                            {!isRegistering ? (
                                <form onSubmit={handleLoginSubmit} className="space-y-5">
                                    <div>
                                        <label className="block text-sm font-bold text-slate-700 mb-2">รหัสผู้ใช้งาน</label>
                                        <input 
                                            type="text" value={username} onChange={(e) => setUsername(e.target.value)}
                                            className="w-full px-5 py-4 bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-blue-500 text-slate-700 font-medium transition-all outline-none"
                                            placeholder="Username" required 
                                        />
                                    </div>
                                    <div>
                                        <label className="block text-sm font-bold text-slate-700 mb-2">รหัสผ่าน</label>
                                        <input 
                                            type="password" value={password} onChange={(e) => setPassword(e.target.value)}
                                            className="w-full px-5 py-4 bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-blue-500 text-slate-700 font-medium transition-all outline-none"
                                            placeholder="••••••" required 
                                        />
                                    </div>
                                    <button 
                                        type="submit" disabled={isLoading}
                                        className={`w-full py-4 mt-2 rounded-xl text-white font-bold text-lg transition-all ${isLoading ? 'bg-slate-400 cursor-not-allowed' : 'bg-gradient-to-r from-blue-600 to-indigo-600 hover:shadow-lg hover:shadow-indigo-500/30 active:scale-[0.98]'}`}
                                    >
                                        {isLoading ? 'กำลังเข้าสู่ระบบ...' : 'เข้าสู่ระบบ'}
                                    </button>
                                    
                                    <div className="text-center pt-4">
                                        <button type="button" onClick={() => { setIsRegistering(true); setError(''); }} className="text-sm font-medium text-indigo-600 hover:text-indigo-800">
                                            ระบบใหม่ยังไม่มีบัญชี? ลงทะเบียนครูผู้สอน
                                        </button>
                                    </div>
                                </form>
                            ) : (
                                <form onSubmit={handleRegisterSubmit} className="space-y-5">
                                    <div>
                                        <label className="block text-sm font-bold text-slate-700 mb-2">ชื่อ - นามสกุล (ครูผู้สอน)</label>
                                        <input 
                                            type="text" value={regName} onChange={(e) => setRegName(e.target.value)}

                    onShowNotification('เกิดข้อผิดพลาดในการสร้างข้อสอบ', 'error');
                } finally {
                    setIsLoading(false);
                }
            };

            const toggleStudentSelection = (studentId) => setSelectedStudentIds(prev => prev.includes(studentId) ? prev.filter(id => id !== studentId) : [...prev, studentId]);
            const selectAllFilteredStudents = (filteredList) => setSelectedStudentIds(prev => Array.from(new Set([...prev, ...filteredList.map(s => s.id)])));
            const deselectAllFilteredStudents = (filteredList) => setSelectedStudentIds(prev => prev.filter(id => !filteredList.map(s => s.id).includes(id)));

            const handleViewResults = async (exam) => {
                setSelectedExam(exam);
                setExamView('results');
                setIsLoading(true);
                try {
                    const data = await api.getExamResults(exam.id);
                    setResults(data);
                } catch (error) {
                    onShowNotification('ไม่สามารถโหลดผลสอบได้', 'error');
                } finally {
                    setIsLoading(false);
                }
            };

            const handleAddStudent = async (e) => {
                e.preventDefault();
                setIsLoading(true);
                try {
                    await api.addStudent({ username: newStudentUsername, name: newStudentName, password: newStudentPassword, grade: newStudentGrade, room: newStudentRoom });
                    onShowNotification('เพิ่มนักเรียนเข้าระบบเรียบร้อย', 'success');
                    setStudentView('list');
                    setNewStudentUsername(''); setNewStudentName(''); setNewStudentPassword('1234');
                    loadData();
                } catch (err) {
                    onShowNotification(err.message, 'error');
                } finally {
                    setIsLoading(false);
                }
            };

            const handleDownloadTemplate = (e) => {
                if (e) e.preventDefault(); // ป้องกันการรีเฟรชหน้าเว็บ
                
                // ข้อมูล CSV พร้อม \uFEFF เพื่อให้ Excel อ่านภาษาไทยได้
                const csvContent = "\uFEFFUsername,Name,Grade,Room,Password\n64001,ด.ช.รักเรียน ดีเยี่ยม,ม.4,1,pass1234\n64002,ด.ญ.ตั้งใจ สมบูรณ์,ม.4,1,pass5678";
                
                // ใช้ Blob เพื่อความเสถียรในการบังคับดาวน์โหลดข้ามเว็บบราวเซอร์ทุกชนิด
                const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
                const url = URL.createObjectURL(blob);
                
                const link = document.createElement("a");
                link.href = url;
                link.setAttribute("download", "student_template.csv");
                
                // ซ่อน Link ไว้แล้วกดจำลองการคลิก
                link.style.visibility = 'hidden';
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
                
                // คืนค่าหน่วยความจำหลังดาวน์โหลดเสร็จ
                URL.revokeObjectURL(url);
            };

            const handleFileUpload = (e) => {
                const file = e.target.files[0];
                if (!file) return;
                setFileName(file.name);
                
                const reader = new FileReader();
                reader.onload = (event) => {
                    const text = event.target.result;
                    const lines = text.trim().split('\n');
                    const parsed = [];
                    const currentExt = students.map(s => s.username);
                    
                    // ข้ามบรรทัดแรก (Header) ถ้าระบบพบคำว่า Username หรือ รหัส
                    let startIndex = 0;
                    if (lines.length > 0 && (lines[0].toLowerCase().includes('username') || lines[0].includes('รหัส'))) {
                        startIndex = 1;
                    }

                    for(let i = startIndex; i < lines.length; i++) {
                        let line = lines[i].trim();
                        if(!line) continue;
                        
                        // แยกด้วย , และตัดเครื่องหมาย " ออกเผื่อมี
                        const cols = line.split(',').map(c => c.trim().replace(/^"|"$/g, ''));
                        
                        if(cols.length >= 5) {
                            const isDup = currentExt.includes(cols[0]) || parsed.some(p => p.username === cols[0]);
                            parsed.push({
                                username: cols[0],
                                name: cols[1],
                                grade: cols[2],
                                room: cols[3],
                                password: cols[4],
                                isValid: !isDup,
                                error: isDup ? 'รหัสซ้ำ' : ''
                            });
                        } else {
                            parsed.push({ raw: line, isValid: false, error: 'คอลัมน์ไม่ครบ 5 (ให้คั่นด้วย , )' });
                        }
                    }
                    setParsedStudents(parsed);
                };
                reader.readAsText(file);
                e.target.value = ''; // เคลียร์ input เผื่อต้องการอัปโหลดไฟล์เดิมซ้ำ
            };

            const handleBulkSubmit = async () => {
                const validStudents = parsedStudents.filter(p => p.isValid);
                if (validStudents.length === 0) return onShowNotification('ไม่มีข้อมูลที่สามารถบันทึกได้', 'error');

                setIsLoading(true);
                try {
                    const result = await api.bulkAddStudents(validStudents);
                    onShowNotification(`เพิ่มนักเรียนสำเร็จ ${result.added} คน (ข้าม ${result.skipped} คนที่ซ้ำ)`, 'success');
                    setStudentView('list');
                    setFileName('');
                    setParsedStudents(null);
                    loadData();
                } catch (err) {
                    onShowNotification('เกิดข้อผิดพลาดในการเพิ่มข้อมูล', 'error');
                } finally {
                    setIsLoading(false);
                }
            };

            const filteredStudents = students.filter(s => (filterGrade === 'all' || s.grade === filterGrade) && (filterRoom === 'all' || s.room === filterRoom));

                            <i className="fa-solid fa-right-from-bracket mr-2"></i> ออกจากระบบ
                        </button>
                    </div>

                    <div className="flex mb-8 bg-slate-200/50 p-1.5 rounded-2xl shadow-inner max-w-xl mx-auto">

                            <i className="fa-solid fa-file-pen mr-2"></i> จัดการวิชาสอบ
                        </button>
                        <button onClick={() => {setActiveTab('students'); setStudentView('list');}} className={`flex-1 py-3 px-6 rounded-xl font-bold transition-all flex items-center justify-center ${activeTab === 'students' ? 'bg-white text-indigo-700 shadow-sm' : 'text-slate-500 hover:text-slate-700 hover:bg-slate-200/50'}`}>
                            <i className="fa-solid fa-users mr-2"></i> ฐานข้อมูลนักเรียน
                        </button>
                    </div>

                    <div className="bg-white rounded-3xl shadow-sm border border-slate-100 p-8 min-h-[500px]">

                                                        <tr className="bg-slate-50 border-b border-slate-200 text-sm">
                                                            <th className="p-4 font-bold text-slate-600">ชื่อวิชา</th>

                                                                        <i className="fa-regular fa-folder-open mr-2"></i> ตรวจข้อสอบ
                                                                    </button>

                                                            <label className="flex items-start p-4 bg-slate-50 border rounded-xl cursor-pointer">
                                                                <input type="checkbox" checked={allowLate} onChange={e=>setAllowLate(e.target.checked)} className="mt-1 mr-4 w-5 h-5 cursor-pointer" />

                                                            </label>
                                                        </div>
                                                        <button type="submit" disabled={isLoading} className="w-full mt-8 py-4 bg-indigo-600 text-white rounded-xl font-bold">{isLoading?'กำลังบันทึก...':'เปิดสอบวิชานี้'}</button>
                                                    </form>
                                                    <div className="bg-white p-8 rounded-3xl border border-slate-200 shadow-sm flex flex-col max-h-[700px]">
                                                        <h3 className="font-bold text-xl mb-4">เลือกผู้มีสิทธิ์สอบ</h3>
                                                        <div className="flex gap-3 mb-4">
                                                            <button type="button" onClick={() => selectAllFilteredStudents(filteredStudents)} className="flex-1 py-2 bg-indigo-50 text-indigo-700 rounded-xl font-bold text-sm">เลือกทั้งหมด</button>
                                                            <button type="button" onClick={() => deselectAllFilteredStudents(filteredStudents)} className="flex-1 py-2 bg-slate-100 text-slate-600 rounded-xl font-bold text-sm">เอาออกทั้งหมด</button>

                                                        <div className="flex-1 overflow-y-auto space-y-2 pr-2">
                                                            {filteredStudents.map(student => (
                                                                <label key={student.id} className="flex items-center p-3 border rounded-xl cursor-pointer hover:bg-slate-50">
                                                                    <input type="checkbox" className="w-5 h-5 mr-4" checked={selectedStudentIds.includes(student.id)} onChange={() => toggleStudentSelection(student.id)}/>
                                                                    <div><div className="font-bold">{student.name} ({student.username})</div><div className="text-xs text-slate-500">{student.grade} / ห้อง {student.room}</div></div>
                                                                </label>
                                                            ))}
                                                        </div>
                                                    </div>
                                                </div>
                                            </div>
                                        )}

                                        {examView === 'results' && selectedExam && (
                                            <div>
                                                <div className="flex items-center mb-8">

                                                </div>
                                                <table className="w-full text-left border-collapse">
                                                    <thead>
                                                        <tr className="bg-slate-50 border-b text-sm"><th className="p-4 font-bold text-slate-600">รหัส</th><th className="p-4 font-bold text-slate-600">ชื่อ-สกุล</th><th className="p-4 font-bold text-slate-600">สถานะ</th><th className="p-4 font-bold text-slate-600">ไฟล์คำตอบ</th></tr>
                                                    </thead>
                                                    <tbody>
                                                        {results.map((result, idx) => (
                                                            <tr key={idx} className="border-b hover:bg-slate-50">
                                                                <td className="p-4 text-sm font-medium">{result.studentId}</td><td className="p-4 font-bold">{result.studentName}</td>
                                                                <td className="p-4"><span className={`px-3 py-1 text-xs font-bold rounded-full ${result.status.includes('ล่าช้า') ? 'bg-amber-100 text-amber-700' : result.status === 'ส่งแล้ว' ? 'bg-emerald-100 text-emerald-700' : 'bg-slate-100 text-slate-600'}`}>{result.status}</span></td>
                                                                <td className="p-4">{result.submission ? <button className="text-indigo-600 font-bold text-sm"><i className="fa-solid fa-download mr-1"></i> {result.submission.fileName}</button> : '-'}</td>
                                                            </tr>
                                                        ))}
                                                    </tbody>
                                                </table>
                                            </div>
                                        )}
                                    </>
                                )}

                                {activeTab === 'students' && (
                                    <>
                                        {studentView === 'list' && (
                                            <div>
                                                <div className="flex justify-between items-center mb-8">
                                                    <h2 className="text-2xl font-bold">รายชื่อนักเรียนในระบบ</h2>
                                                    <button onClick={() => setStudentView('create')} className="px-6 py-3 bg-indigo-600 text-white rounded-xl font-bold"><i className="fa-solid fa-user-plus mr-2"></i> เพิ่มนักเรียน</button>
                                                </div>
                                                <table className="w-full text-left border-collapse">
                                                    <thead><tr className="bg-slate-50 border-b"><th className="p-4">Username</th><th className="p-4">ชื่อ</th><th className="p-4">ชั้น/ห้อง</th><th className="p-4">รหัสผ่าน</th></tr></thead>
                                                    <tbody>{students.map(s => <tr key={s.id} className="border-b"><td className="p-4 font-bold text-indigo-700">{s.username}</td><td className="p-4">{s.name}</td><td className="p-4">{s.grade}/{s.room}</td><td className="p-4 font-mono text-sm">{s.password}</td></tr>)}</tbody>
                                                </table>
                                            </div>
                                        )}
                                        {studentView === 'create' && (
                                            <div className="max-w-4xl mx-auto">
                                                <div className="flex flex-col sm:flex-row sm:items-center justify-between mb-8 gap-4">
                                                    <div className="flex items-center">
                                                        <button onClick={() => { setStudentView('list'); setParsedStudents(null); setFileName(''); }} className="p-2 mr-4 rounded-xl text-slate-500 hover:bg-slate-100"><i className="fa-solid fa-arrow-left text-xl"></i></button>
                                                        <h2 className="text-2xl font-bold">นำนักเรียนเข้าระบบ</h2>
                                                    </div>
                                                    
                                                    {/* ปุ่มสลับโหมดการเพิ่มนักเรียน */}
                                                    <div className="flex bg-slate-200/50 p-1 rounded-xl shadow-inner">
                                                        <button type="button" onClick={() => setAddStudentMode('single')} className={`px-4 py-2 rounded-lg font-bold text-sm transition-all ${addStudentMode === 'single' ? 'bg-white text-indigo-700 shadow-sm' : 'text-slate-500 hover:text-slate-700'}`}>เพิ่มทีละคน</button>
                                                        <button type="button" onClick={() => setAddStudentMode('bulk')} className={`px-4 py-2 rounded-lg font-bold text-sm transition-all ${addStudentMode === 'bulk' ? 'bg-white text-indigo-700 shadow-sm' : 'text-slate-500 hover:text-slate-700'}`}>เพิ่มหลายคน (Excel/CSV)</button>

                                                {/* ฟอร์มเพิ่มทีละคน (Single) */}
                                                {addStudentMode === 'single' ? (
                                                    <form onSubmit={handleAddStudent} className="bg-white p-8 rounded-3xl border shadow-sm space-y-5 max-w-xl mx-auto">

                                                                        <div className="w-16 h-16 bg-white rounded-full flex items-center justify-center shadow-sm mb-4 group-hover:scale-110 transition-transform">
                                                                            <i className="fa-solid fa-cloud-arrow-up text-3xl text-indigo-500"></i>
                                                                        </div>
                                                                        <p className="mb-2 text-sm text-slate-600 font-bold">คลิกเพื่อเลือกไฟล์ .csv ที่นี่</p>
                                                                        <p className="text-xs text-slate-500 font-medium">รองรับเฉพาะนามสกุลไฟล์ .csv เท่านั้น</p>
                                                                    </div>
                                                                    <input type="file" className="hidden" accept=".csv" onChange={handleFileUpload} />
                                                                </label>
                                                            </div>
                                                        ) : (
                                                            <div className="space-y-4 animate-in fade-in duration-300">
                                                                <div className="flex justify-between items-center bg-slate-50 p-3 rounded-lg border border-slate-200">
                                                                    <div className="font-bold text-slate-700 flex items-center">
                                                                        <i className="fa-solid fa-file-csv text-xl mr-2 text-slate-400"></i>
                                                                        ไฟล์: {fileName}
                                                                    </div>
                                                                    <button type="button" onClick={() => { setParsedStudents(null); setFileName(''); }} className="text-sm font-bold text-rose-600 hover:text-rose-800 bg-rose-50 px-3 py-1.5 rounded-md border border-rose-200 transition-colors">เปลี่ยนไฟล์ใหม่</button>
                                                                </div>
                                                                <div className="max-h-80 overflow-y-auto border border-slate-200 rounded-xl">
                                                                    <table className="w-full text-left border-collapse text-sm">
                                                                        <thead className="bg-slate-100 sticky top-0 shadow-sm">
                                                                            <tr>
                                                                                <th className="p-3 font-bold border-b border-slate-200">รหัสผู้ใช้</th>
                                                                                <th className="p-3 font-bold border-b border-slate-200">ชื่อ-สกุล</th>
                                                                                <th className="p-3 font-bold border-b border-slate-200">ชั้น/ห้อง</th>
                                                                                <th className="p-3 font-bold border-b border-slate-200">รหัสผ่าน</th>
                                                                                <th className="p-3 font-bold border-b border-slate-200 text-center">สถานะ</th>
                                                                            </tr>
                                                                        </thead>
                                                                        <tbody>
                                                                            {parsedStudents.map((s, idx) => (
                                                                                <tr key={idx} className={`border-b border-slate-100 ${!s.isValid ? 'bg-rose-50' : 'hover:bg-slate-50'}`}>
                                                                                    {s.username ? (
                                                                                        <>
                                                                                            <td className="p-3 font-mono">{s.username}</td>
                                                                                            <td className="p-3">{s.name}</td>
                                                                                            <td className="p-3">{s.grade}/{s.room}</td>
                                                                                            <td className="p-3 font-mono text-slate-500">{s.password}</td>
                                                                                        </>
                                                                                    ) : (
                                                                                        <td colSpan="4" className="p-3 text-rose-600 font-mono">{s.raw}</td>
                                                                                    )}
                                                                                    <td className="p-3 text-center">
                                                                                        {s.isValid ? (
                                                                                            <span className="text-emerald-600 font-bold"><i className="fa-solid fa-check"></i> พร้อมเพิ่ม</span>
                                                                                        ) : (
                                                                                            <span className="text-rose-600 font-bold text-xs bg-rose-100 px-2 py-1 rounded-full"><i className="fa-solid fa-xmark mr-1"></i> {s.error}</span>
                                                                                        )}
                                                                                    </td>
                                                                                </tr>
                                                                            ))}
                                                                        </tbody>
                                                                    </table>
                                                                </div>
                                                                <button 
                                                                    type="button" 
                                                                    onClick={handleBulkSubmit} 
                                                                    disabled={isLoading || parsedStudents.filter(p => p.isValid).length === 0} 
                                                                    className="w-full py-4 bg-emerald-600 text-white rounded-xl font-bold hover:shadow-lg hover:shadow-emerald-500/30 active:scale-95 transition-all disabled:opacity-50 disabled:cursor-not-allowed mt-4"
                                                                >
                                                                    {isLoading ? 'กำลังบันทึกข้อมูลเข้าฐานข้อมูล...' : `ยืนยันการนำเข้าข้อมูล (${parsedStudents.filter(p => p.isValid).length} รายการ)`}
                                                                </button>
                                                            </div>
                                                        )}
                                                    </div>
                                                )}
                                            </div>
                                        )}
                                    </>
                                )}
                            </>
                        )}
                    </div>
                </div>
            );
        };

        // ---------------------------------------------------------
        // MAIN APP COMPONENT
        // ---------------------------------------------------------
        function App() {
            const [user, setUser] = useState(null);
            const [exams, setExams] = useState([]);
            const [currentView, setCurrentView] = useState('login'); 
            const [activeExam, setActiveExam] = useState(null);
            const [activeSession, setActiveSession] = useState(null);
            const [showInstructions, setShowInstructions] = useState(false);
            const [notification, setNotification] = useState({ message: '', type: '' });
            const [isFirebaseReady, setIsFirebaseReady] = useState(false);

            useEffect(() => {
                // Anonymous Auth เพื่อให้ Firebase Rules ใช้งานได้
                auth.signInAnonymously().then(() => setIsFirebaseReady(true)).catch(console.error);
            }, []);

            useEffect(() => {
                if (user && user.role === 'student' && currentView === 'dashboard') {
                    api.getExams(user.id, user.role).then(setExams).catch(console.error);
                }
            }, [user, currentView]);

            const showNotification = (message, type = 'success') => {
                setNotification({ message, type });
                setTimeout(() => setNotification({ message: '', type: '' }), 4000);
            };

            const handleLogin = (loggedInUser) => {
                setUser(loggedInUser);
                setShowInstructions(true);
            };

            const proceedToDashboard = () => {
                setShowInstructions(false);
                setCurrentView(user.role === 'teacher' ? 'teacher_dashboard' : 'dashboard');
            };

            const handleLogout = () => {
                setUser(null); setCurrentView('login'); setActiveExam(null); setActiveSession(null); setShowInstructions(false);
            };

            if (!isFirebaseReady) return <div className="min-h-screen flex items-center justify-center"><i className="fa-solid fa-spinner fa-spin text-4xl text-indigo-500"></i></div>;

            return (
                <div className="min-h-screen bg-slate-50 font-sans text-slate-800">
                    <Notification message={notification.message} type={notification.type} onClose={() => setNotification({ message: '', type: '' })} />
                    
                    {currentView === 'login' && !showInstructions && <LoginView onLogin={handleLogin} />}
                    {showInstructions && user && <InstructionModal role={user.role} onAccept={proceedToDashboard} />}
                    {currentView === 'teacher_dashboard' && user?.role === 'teacher' && !showInstructions && <TeacherDashboardView user={user} onLogout={handleLogout} onShowNotification={showNotification} />}
                    {currentView === 'dashboard' && user?.role === 'student' && !showInstructions && <DashboardView user={user} exams={exams} onStartExam={ex => {setActiveExam(ex); setActiveSession(ex.session||null); setCurrentView('exam');}} onLogout={handleLogout} />}
                    {currentView === 'exam' && user && activeExam && !showInstructions && (
                        <ExamRoomView user={user} exam={activeExam} session={activeSession} onStartSession={async (ex) => setActiveSession(await api.startSession(user.id, ex.id))} onBack={() => {setCurrentView('dashboard'); setActiveExam(null); setActiveSession(null);}} onShowNotification={showNotification} />
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
