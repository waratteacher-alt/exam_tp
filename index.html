<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ExamOnline - ระบบสอบออนไลน์</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
        /* ฟอนต์ Prompt ดูทันสมัย อ่านง่าย และมีความเป็นทางการ */
        @import url('https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap');

        html { font-size: 15px; } 
        body { 
            font-family: 'Prompt', sans-serif; 
            color: #1e293b; 
            margin: 0; 
            padding: 0; 
            min-height: 100vh;
            background-color: #f1f5f9; 
        }
        
        /* สไตล์การ์ดแบบเป็นทางการ ขอบมนกำลังดี */
        .modern-card { 
            background: #ffffff; 
            border: 1px solid #e2e8f0; 
            border-radius: 1rem; 
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -1px rgba(0, 0, 0, 0.03); 
            transition: box-shadow 0.3s ease; 
        }
        .modern-card:hover {
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.08), 0 4px 6px -2px rgba(0, 0, 0, 0.04);
        }

        .primary-bg { background-color: #1e3a8a; } /* สีน้ำเงินเข้มแบบองค์กร */
        .primary-btn { background-color: #2563eb; color: white; transition: background-color 0.2s; }
        .primary-btn:hover:not(:disabled) { background-color: #1d4ed8; }
        .primary-btn:disabled { background-color: #94a3b8; cursor: not-allowed; }

        .checkbox-wrapper input:checked + div { background-color: #2563eb; border-color: #2563eb; }
        .checkbox-wrapper input:checked + div i { display: block; }
        
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }

        /* Loader */
        .spinner { border: 3px solid rgba(255, 255, 255, 0.3); border-radius: 50%; border-top-color: #fff; animation: spin 1s ease-in-out infinite; }
        .spinner-blue { border: 3px solid rgba(37, 99, 235, 0.2); border-top-color: #2563eb; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel" data-type="module">
        const { useState, useEffect, useRef } = React;

        // ==========================================
        // ⚠️ วาง URL ของ Google Apps Script ที่นี่
        // ==========================================
        const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxdWB8xl_FbXH5BWFeGElkCycH3yLvYH5MIr7N5TNwR8p11RucwoHsbEFGwglY_5GnZ/exec";

        // Helper: แปลงไฟล์เป็น Base64
        const fileToBase64 = (file) => {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = () => resolve({ name: file.name, mimeType: file.type, base64: reader.result });
                reader.onerror = error => reject(error);
            });
        };

        // ---------------------------------------------------------
        // API LAYER (เชื่อมต่อกับ Google Apps Script)
        // ---------------------------------------------------------
        const api = {
            call: async (action, payload = {}) => {
                try {
                    const response = await fetch(GOOGLE_SCRIPT_URL, {
                        method: 'POST',
                        body: JSON.stringify({ action, payload })
                    });
                    const result = await response.json();
                    if (!result.success) throw new Error(result.error);
                    return result.data;
                } catch (e) {
                    throw new Error(e.message || "เกิดข้อผิดพลาดในการเชื่อมต่อกับเซิร์ฟเวอร์");
                }
            },
            
            login: async (username, password) => api.call('login', { username, password }),
            registerTeacher: async (data) => api.call('registerTeacher', data),
            updateProfilePic: async (userId, base64) => api.call('updateProfilePic', { userId, base64 }),
            getExams: async (userId, role) => api.call('getExams', { userId, role }),
            startSession: async (userId, examId) => api.call('startSession', { userId, examId }),
            submitAnswer: async (sessionId, file) => {
                const fileData = await fileToBase64(file);
                return api.call('submitAnswer', { sessionId, file: fileData });
            },
            createExam: async (examData, files) => {
                const filesData = await Promise.all(files.map(f => fileToBase64(f)));
                return api.call('createExam', { examData, files: filesData });
            },
            getExamResults: async (examId) => api.call('getExamResults', { examId }),
            updateScore: async (submissionId, score) => api.call('updateScore', { submissionId, score }),
            getStudents: async () => api.call('getStudents'),
            addStudent: async (data) => api.call('addStudent', data),
            bulkAddStudents: async (dataArray) => api.call('bulkAddStudents', dataArray),
            updateUser: async (userId, updateData) => api.call('updateUser', { userId, updateData }),
            deleteUser: async (userId) => api.call('deleteUser', { userId })
        };

        // ---------------------------------------------------------
        // COMPONENTS ทั่วไป
        // ---------------------------------------------------------
        const Notification = ({ message, type, onClose }) => {
            if (!message) return null;
            const isError = type === 'error';
            return (
                <div className={`fixed top-6 right-6 z-[100] flex items-center p-4 border rounded-lg shadow-lg transition-all duration-300 animate-in slide-in-from-top-5 max-w-sm ${isError ? 'bg-white border-red-200 text-red-700' : 'bg-white border-green-200 text-green-700'}`}>
                    <div className={`flex items-center justify-center text-xl mr-3 ${isError ? 'text-red-500' : 'text-green-500'}`}>
                        <i className={`fa-solid ${isError ? 'fa-circle-exclamation' : 'fa-circle-check'}`}></i>
                    </div>
                    <span className="font-semibold flex-1 text-sm">{message}</span>
                    <button onClick={onClose} className="ml-3 text-gray-400 hover:text-gray-600"><i className="fa-solid fa-xmark"></i></button>
                </div>
            );
        };

        const InstructionModal = ({ role, onAccept }) => {
            return (
                <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/60 backdrop-blur-sm">
                    <div className="bg-white rounded-2xl w-full max-w-2xl p-8 animate-in zoom-in-95 duration-200 shadow-xl">
                        <div className="flex items-center mb-6 pb-4 border-b border-gray-100">
                            <i className="fa-solid fa-circle-info text-blue-600 text-2xl mr-3"></i>
                            <h2 className="text-2xl font-bold text-slate-800">ข้อกำหนดการใช้งานระบบ</h2>
                        </div>
                        
                        <div className="space-y-4 mb-8 text-slate-600 text-base">
                            {role === 'student' ? (
                                <>
                                    <div className="flex items-start"><i className="fa-solid fa-play text-blue-500 mt-1 mr-3 w-5 text-center"></i><p>ระบบจะเริ่มนับเวลาสอบ <span className="font-semibold text-red-600">ทันที</span> ที่มีการดาวน์โหลดข้อสอบ</p></div>
                                    <div className="flex items-start"><i className="fa-solid fa-wifi text-blue-500 mt-1 mr-3 w-5 text-center"></i><p>ในกรณีที่อินเทอร์เน็ตมีปัญหา ผู้สอบสามารถเข้าสู่ระบบเพื่อดำเนินการต่อได้ (เวลาสอบจะนับต่อเนื่อง)</p></div>
                                    <div className="flex items-start"><i className="fa-solid fa-file-arrow-up text-blue-500 mt-1 mr-3 w-5 text-center"></i><p>ไฟล์กระดาษคำตอบที่อัปโหลดจะถูกจัดเก็บลงใน Google Drive ของผู้สอนโดยอัตโนมัติ</p></div>
                                </>
                            ) : (
                                <>
                                    <div className="flex items-start"><i className="fa-solid fa-cloud text-blue-500 mt-1 mr-3 w-5 text-center"></i><p>ระบบเชื่อมต่อกับ <b>Google Drive</b> อัตโนมัติ ไฟล์เอกสารจะถูกจัดเก็บอย่างปลอดภัย</p></div>
                                    <div className="flex items-start"><i className="fa-solid fa-users text-blue-500 mt-1 mr-3 w-5 text-center"></i><p>กรุณาเพิ่มรายชื่อนักเรียนในเมนู "ฐานข้อมูลนักเรียน" ก่อนทำการสร้างวิชาสอบ</p></div>
                                    <div className="flex items-start"><i className="fa-solid fa-database text-blue-500 mt-1 mr-3 w-5 text-center"></i><p>ข้อมูลต่างๆ ถูกบันทึกลง <b>Google Sheets</b> เพื่อความสะดวกในการประมวลผล</p></div>
                                </>
                            )}
                        </div>
                        <div className="flex justify-end pt-4 border-t border-gray-100">
                            <button onClick={onAccept} className="px-6 py-3 rounded-lg text-white font-semibold primary-btn">
                                รับทราบและเข้าสู่ระบบ
                            </button>
                        </div>
                    </div>
                </div>
            );
        };

        const ProfileModal = ({ user, onClose, onUpdateProfile, onShowNotification }) => {
            const [name, setName] = useState(user.name || ''); 
            const [password, setPassword] = useState(user.password || ''); 
            const [isLoading, setIsLoading] = useState(false);

            const handleSubmit = async (e) => {
                e.preventDefault(); 
                setIsLoading(true);
                try { 
                    await api.updateUser(user.id, { name, password }); 
                    onUpdateProfile({ ...user, name, password }); 
                    onShowNotification('อัปเดตข้อมูลสำเร็จ', 'success'); 
                    onClose(); 
                } 
                catch (error) { onShowNotification('เกิดข้อผิดพลาด: ' + error.message, 'error'); } 
                finally { setIsLoading(false); }
            };
            return (
                <div className="fixed inset-0 z-[60] flex items-center justify-center p-4 bg-slate-900/60 backdrop-blur-sm">
                    <div className="bg-white rounded-2xl shadow-xl w-full max-w-sm p-6 animate-in zoom-in-95">
                        <div className="flex justify-between items-center mb-6 pb-4 border-b border-slate-100">
                            <h2 className="text-xl font-bold text-slate-800">ตั้งค่าบัญชีผู้ใช้</h2>
                            <button onClick={onClose} className="text-slate-400 hover:text-slate-600"><i className="fa-solid fa-xmark text-lg"></i></button>
                        </div>
                        <form onSubmit={handleSubmit} className="space-y-4">
                            <div>
                                <label className="block font-medium text-slate-600 mb-1 text-sm">ชื่อ - นามสกุล</label>
                                <input type="text" required value={name} onChange={e => setName(e.target.value)} className="w-full px-4 py-2 border border-slate-300 rounded-lg focus:border-blue-500 focus:ring-1 focus:ring-blue-500 outline-none text-slate-800" />
                            </div>
                            <div>
                                <label className="block font-medium text-slate-600 mb-1 text-sm">รหัสผ่านใหม่</label>
                                <input type="text" required value={password} onChange={e => setPassword(e.target.value)} className="w-full px-4 py-2 border border-slate-300 rounded-lg focus:border-blue-500 focus:ring-1 focus:ring-blue-500 outline-none text-slate-800" />
                            </div>
                            <div className="pt-4">
                                <button type="submit" disabled={isLoading} className="w-full py-3 primary-btn rounded-lg font-semibold flex justify-center items-center">
                                    {isLoading ? <div className="spinner border-white w-5 h-5 mr-2"></div> : 'บันทึกการเปลี่ยนแปลง'}
                                </button>
                            </div>
                        </form>
                    </div>
                </div>
            );
        };

        // ---------------------------------------------------------
        // ONBOARDING VIEW (หน้าอัปโหลดรูปครั้งแรก)
        // ---------------------------------------------------------
        const OnboardingView = ({ user, onComplete, onShowNotification }) => {
            const [preview, setPreview] = useState(null);
            const [isUploading, setIsUploading] = useState(false);
            const fileInputRef = useRef(null);

            const handleImageChange = (e) => {
                const file = e.target.files[0];
                if (!file) return;
                if (!file.type.startsWith('image/')) return onShowNotification('กรุณาอัปโหลดไฟล์รูปภาพเท่านั้น', 'error');
                
                const reader = new FileReader();
                reader.onload = (event) => {
                    const img = new Image();
                    img.onload = () => {
                        const canvas = document.createElement('canvas');
                        let width = img.width; let height = img.height;
                        if (width > height) { if (width > 400) { height *= 400 / width; width = 400; } } 
                        else { if (height > 400) { width *= 400 / height; height = 400; } }
                        canvas.width = width; canvas.height = height;
                        canvas.getContext('2d').drawImage(img, 0, 0, width, height);
                        setPreview(canvas.toDataURL('image/jpeg', 0.7));
                    };
                    img.src = event.target.result;
                };
                reader.readAsDataURL(file);
            };

            const handleSave = async () => {
                if (!preview) return onShowNotification('กรุณาอัปโหลดรูปประจำตัวก่อนดำเนินการต่อ', 'error');
                setIsUploading(true);
                try {
                    const res = await api.updateProfilePic(user.id, preview);
                    onShowNotification('บันทึกข้อมูลเรียบร้อยแล้ว', 'success');
                    onComplete({ ...user, profilePic: res.profilePic });
                } catch (err) { onShowNotification(err.message, 'error'); } 
                finally { setIsUploading(false); }
            };

            return (
                <div className="min-h-screen flex items-center justify-center p-4">
                    <div className="modern-card w-full max-w-md p-8 text-center">
                        <div className="w-16 h-16 bg-blue-50 text-blue-600 rounded-full flex items-center justify-center mx-auto mb-6 text-2xl">
                            <i className="fa-solid fa-id-badge"></i>
                        </div>
                        <h2 className="text-2xl font-bold text-slate-800 mb-2">ข้อมูลยืนยันตัวตน</h2>
                        <p className="text-slate-500 text-sm mb-6">กรุณาอัปโหลดรูปถ่ายหน้าตรงที่ชัดเจน เพื่อใช้ประกอบการประเมินผล</p>
                        
                        <div className="mb-8">
                            <input type="file" accept="image/*" ref={fileInputRef} onChange={handleImageChange} className="hidden" />
                            <div onClick={() => fileInputRef.current.click()} className={`mx-auto w-32 h-32 rounded-full border-2 border-dashed flex items-center justify-center cursor-pointer transition-colors overflow-hidden relative group ${preview ? 'border-blue-500 bg-white' : 'border-slate-300 bg-slate-50 hover:bg-slate-100'}`}>
                                {preview ? ( 
                                    <>
                                        <img src={preview} className="w-full h-full object-cover" />
                                        <div className="absolute inset-0 bg-slate-900/50 flex flex-col items-center justify-center opacity-0 group-hover:opacity-100 transition-opacity">
                                            <i className="fa-solid fa-pen text-white mb-1"></i>
                                            <span className="text-white text-xs">แก้ไขรูปภาพ</span>
                                        </div>
                                    </> 
                                ) : ( 
                                    <div className="text-slate-400 group-hover:text-blue-500 text-center">
                                        <i className="fa-solid fa-camera text-2xl mb-1"></i>
                                        <div className="text-xs">เลือกรูปภาพ</div>
                                    </div> 
                                )}
                            </div>
                        </div>
                        <button onClick={handleSave} disabled={!preview || isUploading} className={`w-full py-3 rounded-lg font-semibold text-base flex justify-center items-center ${!preview || isUploading ? 'bg-slate-200 text-slate-500 cursor-not-allowed' : 'primary-btn'}`}>
                            {isUploading ? <><div className="spinner border-white w-5 h-5 mr-2"></div> กำลังบันทึก...</> : 'ยืนยันข้อมูล'}
                        </button>
                    </div>
                </div>
            );
        };

        // ---------------------------------------------------------
        // LOGIN VIEW
        // ---------------------------------------------------------
        const LoginView = ({ onLogin }) => {
            const [isRegistering, setIsRegistering] = useState(false); 
            const [username, setUsername] = useState(''); 
            const [password, setPassword] = useState('');
            const [regName, setRegName] = useState(''); 
            const [regUsername, setRegUsername] = useState(''); 
            const [regPassword, setRegPassword] = useState('');
            const [isLoading, setIsLoading] = useState(false); 
            const [error, setError] = useState('');

            const handleLoginSubmit = async (e) => { 
                e.preventDefault(); setIsLoading(true); setError(''); 
                try { 
                    const user = await api.login(username, password); 
                    // เก็บ session ไว้ในเครื่อง
                    localStorage.setItem('exam_user_session', JSON.stringify(user));
                    onLogin(user); 
                } 
                catch (err) { setError(err.message); } 
                finally { setIsLoading(false); } 
            };
            const handleRegisterSubmit = async (e) => { 
                e.preventDefault(); setIsLoading(true); setError(''); 
                try { await api.registerTeacher({ name: regName, username: regUsername, password: regPassword }); setIsRegistering(false); setUsername(regUsername); setPassword(regPassword); setError('ลงทะเบียนสำเร็จ สามารถเข้าสู่ระบบได้ทันที'); } 
                catch (err) { setError(err.message); } 
                finally { setIsLoading(false); } 
            };

            return (
                <div className="flex min-h-screen items-center justify-center p-4 primary-bg">
                    <div className="w-full max-w-md bg-white rounded-xl shadow-2xl overflow-hidden animate-in fade-in duration-500">
                        <div className="bg-slate-50 border-b border-slate-100 p-8 text-center">
                            <div className="inline-flex items-center justify-center w-16 h-16 bg-blue-600 text-white rounded-lg mb-4 shadow-md">
                                <i className="fa-solid fa-graduation-cap text-3xl"></i>
                            </div>
                            <h2 className="text-2xl font-bold text-slate-800 tracking-wide">ExamOnline</h2>
                            <p className="text-slate-500 mt-1 text-sm">{isRegistering ? 'ลงทะเบียนบัญชีผู้สอน' : 'ระบบทดสอบและประเมินผลออนไลน์'}</p>
                        </div>
                        
                        <div className="p-8">
                            {error && <div className={`mb-6 p-3 text-sm font-medium rounded-lg flex items-center border ${error.includes('สำเร็จ') ? 'bg-green-50 text-green-700 border-green-200' : 'bg-red-50 text-red-600 border-red-200'}`}><i className="fa-solid fa-circle-info mr-2"></i>{error}</div>}
                            
                            {!isRegistering ? (
                                <form onSubmit={handleLoginSubmit} className="space-y-4">
                                    <div>
                                        <label className="block text-sm font-medium text-slate-700 mb-1">รหัสผู้ใช้งาน</label>
                                        <input type="text" value={username} onChange={e => setUsername(e.target.value)} className="w-full px-4 py-3 bg-white border border-slate-300 rounded-lg focus:border-blue-500 focus:ring-1 focus:ring-blue-500 outline-none transition-colors" required />
                                    </div>
                                    <div>
                                        <label className="block text-sm font-medium text-slate-700 mb-1">รหัสผ่าน</label>
                                        <input type="password" value={password} onChange={e => setPassword(e.target.value)} className="w-full px-4 py-3 bg-white border border-slate-300 rounded-lg focus:border-blue-500 focus:ring-1 focus:ring-blue-500 outline-none transition-colors" required />
                                    </div>
                                    <div className="pt-2">
                                        <button type="submit" disabled={isLoading} className="w-full py-3 flex justify-center items-center rounded-lg text-white font-semibold transition-colors primary-btn disabled:bg-slate-300">
                                            {isLoading ? <div className="spinner border-white w-5 h-5"></div> : 'เข้าสู่ระบบ'}
                                        </button>
                                    </div>
                                    <div className="text-center pt-4"><button type="button" onClick={() => { setIsRegistering(true); setError(''); }} className="text-sm font-medium text-blue-600 hover:text-blue-800 transition-colors">ลงทะเบียนสำหรับผู้สอน</button></div>
                                </form>
                            ) : (
                                <form onSubmit={handleRegisterSubmit} className="space-y-4">
                                    <div>
                                        <label className="block text-sm font-medium text-slate-700 mb-1">ชื่อ - นามสกุล (ผู้สอน)</label>
                                        <input type="text" value={regName} onChange={e => setRegName(e.target.value)} className="w-full px-4 py-2 border border-slate-300 rounded-lg focus:border-blue-500 focus:ring-1 focus:ring-blue-500 outline-none" required />
                                    </div>
                                    <div>
                                        <label className="block text-sm font-medium text-slate-700 mb-1">รหัสผู้ใช้งาน (Username)</label>
                                        <input type="text" value={regUsername} onChange={e => setRegUsername(e.target.value)} className="w-full px-4 py-2 border border-slate-300 rounded-lg focus:border-blue-500 focus:ring-1 focus:ring-blue-500 outline-none" required />
                                    </div>
                                    <div>
                                        <label className="block text-sm font-medium text-slate-700 mb-1">รหัสผ่าน</label>
                                        <input type="password" value={regPassword} onChange={e => setRegPassword(e.target.value)} className="w-full px-4 py-2 border border-slate-300 rounded-lg focus:border-blue-500 focus:ring-1 focus:ring-blue-500 outline-none" required />
                                    </div>
                                    <div className="pt-2">
                                        <button type="submit" disabled={isLoading} className="w-full py-3 flex justify-center items-center rounded-lg text-white font-semibold transition-colors bg-slate-800 hover:bg-slate-900 disabled:bg-slate-300">
                                            {isLoading ? <div className="spinner border-white w-5 h-5"></div> : 'ยืนยันการลงทะเบียน'}
                                        </button>
                                    </div>
                                    <div className="text-center pt-4"><button type="button" onClick={() => { setIsRegistering(false); setError(''); }} className="text-sm font-medium text-slate-500 hover:text-slate-800 transition-colors">ย้อนกลับไปหน้าเข้าสู่ระบบ</button></div>
                                </form>
                            )}
                        </div>
                    </div>
                </div>
            );
        };

        // ---------------------------------------------------------
        // STUDENT DASHBOARD
        // ---------------------------------------------------------
        const DashboardView = ({ user, exams, onStartExam, onLogout, onUpdateUser, onShowNotification, onRefresh, isRefreshing }) => {
            const [showProfile, setShowProfile] = useState(false);
            return (

        const TeacherDashboardView = ({ user, onLogout, onShowNotification, onUpdateUser, onRefresh, isRefreshing }) => {

            const loadData = async () => {

            // หากโดนสั่งให้รีเฟรชจากภายนอก ให้โหลดข้อมูลใหม่

            // ฟังก์ชันดาวน์โหลดเทมเพลต CSV
            const handleDownloadTemplate = (e) => {
                e.preventDefault();
                const bom = "\uFEFF";
                const template = bom + "รหัสผู้ใช้,ชื่อ-สกุล,ชั้น,ห้อง,รหัสผ่าน\n1001,นายเรียนดี มีวินัย,ม.4,1,1234\n1002,นางสาวตั้งใจ ใฝ่รู้,ม.4,1,1234";

            const handleSaveScore = async (submissionId, score) => { try { await api.updateScore(submissionId, score); onShowNotification('บันทึกคะแนนเรียบร้อย', 'success'); } catch (err) { onShowNotification('เกิดข้อผิดพลาดในการบันทึก', 'error'); } };
            const handleExportCSV = () => { const bom = "\uFEFF"; let csvContent = bom + "รหัสผู้ใช้,ชื่อ-สกุล,ชั้น/ห้อง,สถานะ,ลิงก์ไฟล์(Drive),คะแนน\n"; results.forEach(r => { const score = r.submission && r.submission.score !== null ? r.submission.score : ''; const link = r.submission && r.submission.fileUrl ? r.submission.fileUrl : '-'; csvContent += `${r.studentId},${r.studentName},${r.grade}/${r.room},${r.status},${link},${score}\n`; }); const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' }); const url = URL.createObjectURL(blob); const link = document.createElement("a"); link.setAttribute("href", url); link.setAttribute("download", `คะแนนสอบ_${selectedExam?.title || 'รายวิชา'}.csv`); document.body.appendChild(link); link.click(); document.body.removeChild(link); };

            const searchedStudents = students.filter(s => s.name.toLowerCase().includes(searchStudent.toLowerCase()) || s.username.toLowerCase().includes(searchStudent.toLowerCase()));

                                                        <div><label className="block text-xs font-medium text-slate-600 mb-1">ชื่อ-สกุล</label><input type="text" required value={newStudentName} onChange={e => setNewStudentName(e.target.value)} className="w-full px-3 py-2 border border-slate-300 rounded focus:border-blue-500 outline-none text-sm" /></div>
                                                        <div className="flex gap-4"><div className="flex-1"><label className="block text-xs font-medium text-slate-600 mb-1">ชั้น</label><input type="text" value={newStudentGrade} onChange={e => setNewStudentGrade(e.target.value)} className="w-full px-3 py-2 border border-slate-300 rounded focus:border-blue-500 outline-none text-sm" /></div><div className="flex-1"><label className="block text-xs font-medium text-slate-600 mb-1">ห้อง</label><input type="text" value={newStudentRoom} onChange={e => setNewStudentRoom(e.target.value)} className="w-full px-3 py-2 border border-slate-300 rounded focus:border-blue-500 outline-none text-sm" /></div></div>
                                                        <div><label className="block text-xs font-medium text-slate-600 mb-1">รหัสผ่านเริ่มต้น</label><input type="text" required value={newStudentPassword} onChange={e => setNewStudentPassword(e.target.value)} className="w-full px-3 py-2 border border-slate-300 rounded focus:border-blue-500 outline-none text-sm" /></div>
                                                        <button type="submit" disabled={isLoading} className="w-full py-2.5 mt-2 primary-btn rounded font-medium text-sm flex justify-center items-center">{isLoading ? <div className="spinner w-4 h-4 border-white"></div> : 'ดำเนินการบันทึก'}</button>
                                                    </form>
                                                ) : (
                                                    <div>
                                                        <div className="bg-slate-50 p-4 rounded border border-slate-200 mb-4 flex justify-between items-center text-sm"><div><span className="font-semibold text-slate-700 block mb-1">1. เอกสารต้นแบบ (Template)</span><span className="text-xs text-slate-500">รูปแบบไฟล์ CSV สำหรับกรอกข้อมูล</span></div><button onClick={handleDownloadTemplate} className="px-3 py-1.5 bg-white border border-slate-300 text-slate-600 rounded hover:bg-slate-50 transition-colors text-xs font-medium"><i className="fa-solid fa-download mr-1"></i> ดาวน์โหลด</button></div>
                                                        <div className="bg-slate-50 p-4 rounded border border-slate-200 mb-4"><span className="font-semibold text-slate-700 block mb-2 text-sm">2. นำเข้าข้อมูลเอกสาร</span><input type="file" accept=".csv" onChange={(e) => { const file = e.target.files[0]; if(file){ const reader = new FileReader(); reader.onload=(event)=>setCsvData(event.target.result); reader.readAsText(file); } }} className="w-full text-xs bg-white border border-slate-200 rounded p-2" /></div>
                                                        <button onClick={handleBulkImport} disabled={!csvData || isLoading} className="w-full py-2.5 primary-btn rounded font-medium text-sm flex justify-center items-center disabled:opacity-50">{isLoading ? <div className="spinner w-4 h-4 border-white"></div> : 'ดำเนินการนำเข้าข้อมูล'}</button>
                                                    </div>
                                                )}
                                            </div>
                                        )}
                                    </>
                                )}
                            </>
                        )}
                    </div>
                </div>
            );
        };

        // ---------------------------------------------------------
        // MAIN APP
        // ---------------------------------------------------------
        const App = () => {
            const [user, setUser] = useState(null); 
            const [exams, setExams] = useState([]); 
            const [currentView, setCurrentView] = useState('login'); 
            const [activeExam, setActiveExam] = useState(null); 
            const [activeSession, setActiveSession] = useState(null); 
            const [showInstructions, setShowInstructions] = useState(false); 
            const [notification, setNotification] = useState({ message: '', type: '' }); 
            const [isReady, setIsReady] = useState(false);
            const [isRefreshing, setIsRefreshing] = useState(false);

            // ตรวจสอบ Session เก่าตอนเปิดเว็บ
            useEffect(() => { 
                const savedUser = localStorage.getItem('exam_user_session');
                if (savedUser) {
                    try {
                        const parsedUser = JSON.parse(savedUser);
                        setUser(parsedUser);
                        if (parsedUser.role === 'teacher') {
                            setCurrentView('teacher_dashboard');
                        } else {
                            if (!parsedUser.profilePic) setCurrentView('onboarding');
                            else setCurrentView('dashboard');
                        }
                    } catch (e) {
                        localStorage.removeItem('exam_user_session');
                    }
                }
                setIsReady(true); 
            }, []);

            const showNotification = (message, type = 'success') => { setNotification({ message, type }); setTimeout(() => setNotification({ message: '', type: '' }), 4000); };
            
            const fetchExamsData = async (u) => { 
                try { 
                    const data = await api.getExams(u.id, u.role); 
                    setExams(data); 
                } catch(e){ 
                    console.error(e); 
                } 
            };

            useEffect(() => { 
                if (user && user.role === 'student' && currentView === 'dashboard') { 
                    fetchExamsData(user); 
                } 
            }, [user, currentView]);

            const handleRefreshData = async (triggerLoader = false) => {
                if(!user) return;
                if(triggerLoader) setIsRefreshing(true);
                await fetchExamsData(user);
                if(triggerLoader) setIsRefreshing(false);
            };

            const handleLogin = (loggedInUser) => { 
                setUser(loggedInUser); 
                localStorage.setItem('exam_user_session', JSON.stringify(loggedInUser)); // บันทึก Session
                if (loggedInUser.role === 'student' && !loggedInUser.profilePic) { setCurrentView('onboarding'); } 
                else { setShowInstructions(true); } 
            };
            const proceedToDashboard = () => { setShowInstructions(false); if (user.role === 'teacher') setCurrentView('teacher_dashboard'); else setCurrentView('dashboard'); };
            
            const handleLogout = () => { 
                setUser(null); 
                localStorage.removeItem('exam_user_session'); // ล้าง Session
                setCurrentView('login'); 
                setActiveExam(null); 
                setActiveSession(null); 
                setShowInstructions(false); 
            };
            
            const handleUpdateUser = (updatedUser) => { 
                setUser(updatedUser); 
                localStorage.setItem('exam_user_session', JSON.stringify(updatedUser)); // อัปเดต Session
            };
            const handleEnterExamRoom = (exam) => { setActiveExam(exam); setActiveSession(exam.session || null); setCurrentView('exam'); };
            const handleStartSession = async (exam) => { const session = await api.startSession(user.id, exam.id); setActiveSession(session); return session; };

            if (!isReady) return (<div className="min-h-screen flex items-center justify-center bg-slate-50"><div className="spinner-blue w-10 h-10"></div></div>);

            return (
                <div className="min-h-screen">
                    <Notification message={notification.message} type={notification.type} onClose={() => setNotification({ message: '', type: '' })} />
                    {currentView === 'login' && !showInstructions && <LoginView onLogin={handleLogin} />}
                    {currentView === 'onboarding' && user && <OnboardingView user={user} onShowNotification={showNotification} onComplete={(updatedUser) => { setUser(updatedUser); setCurrentView('login'); setShowInstructions(true); }} />}
                    {showInstructions && user && currentView !== 'onboarding' && <InstructionModal role={user.role} onAccept={proceedToDashboard} />}
                    {currentView === 'teacher_dashboard' && user?.role === 'teacher' && !showInstructions && <TeacherDashboardView user={user} onLogout={handleLogout} onShowNotification={showNotification} onUpdateUser={handleUpdateUser} onRefresh={setIsRefreshing} isRefreshing={isRefreshing} />}
                    {currentView === 'dashboard' && user?.role === 'student' && !showInstructions && <DashboardView user={user} exams={exams} onStartExam={handleEnterExamRoom} onLogout={handleLogout} onShowNotification={showNotification} onUpdateUser={handleUpdateUser} onRefresh={handleRefreshData} isRefreshing={isRefreshing} />}
                    {currentView === 'exam' && user && activeExam && !showInstructions && <ExamRoomView user={user} exam={activeExam} session={activeSession} onStartSession={handleStartSession} onBack={() => { setCurrentView('dashboard'); fetchExamsData(user); setActiveExam(null); setActiveSession(null); }} onShowNotification={showNotification} />}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
