<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบสอบออนไลน์ (Online Examination System)</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Google Fonts: Sarabun -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    
    <!-- Babel for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
        /* นำเข้าฟอนต์ TH Sarabun New (ราชการ) */
        @font-face {
            font-family: 'TH Sarabun New';
            src: url('https://cdn.jsdelivr.net/gh/lazywasabi/thai-web-fonts@7/fonts/SarabunNew/THSarabunNew.woff2') format('woff2');
            font-weight: normal;
            font-style: normal;
        }
        @font-face {
            font-family: 'TH Sarabun New';
            src: url('https://cdn.jsdelivr.net/gh/lazywasabi/thai-web-fonts@7/fonts/SarabunNew/THSarabunNew-Bold.woff2') format('woff2');
            font-weight: bold;
            font-style: normal;
        }

        /* ตั้งค่าสัดส่วน 70% และฟอนต์ทางการตามที่ร้องขอ */
        html { 
            font-size: 70%; 
            font-family: 'TH Sarabun New', 'Sarabun', sans-serif;
        }
        body {
            font-family: 'TH Sarabun New', 'Sarabun', sans-serif;
            background-color: #f8fafc;
        }
        
        /* Custom Checkbox Animation */
        .checkbox-wrapper input:checked + div {
            background-color: #4f46e5;
            border-color: #4f46e5;
        }
        .checkbox-wrapper input:checked + div i {
            display: block;
        }
        
        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: #f1f5f9; border-radius: 10px; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel" data-type="module">
        const { useState, useEffect, useRef } = React;

        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore, collection, getDocs, addDoc, doc, updateDoc, query, where, writeBatch } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
        import { getStorage, ref, uploadBytes, getDownloadURL } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-storage.js";

        // ---------------------------------------------------------
        // FIREBASE CONFIGURATION
        // ---------------------------------------------------------
        const firebaseConfig = {
            apiKey: "AIzaSyACCbQAf5PkWe4J-IZoHF_8iF5Y4-kufw4",
            authDomain: "exam-tp-4339b.firebaseapp.com",
            projectId: "exam-tp-4339b",
            storageBucket: "exam-tp-4339b.firebasestorage.app",
            messagingSenderId: "698899405862",
            appId: "1:698899405862:web:1db255c6e8f324973a9ae7",
            measurementId: "G-N01SCQFTZP"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const storage = getStorage(app);

        // ---------------------------------------------------------
        // API LAYER
        // ---------------------------------------------------------
        const api = {
            login: async (username, password) => {
                const snapshot = await getDocs(collection(db, 'exam_users'));
                const users = snapshot.docs.map(d => ({ id: d.id, ...d.data() }));
                const user = users.find(u => u.username === username && u.password === password);
                if (user) {
                    return { id: user.id, name: user.name, role: user.role, grade: user.grade, room: user.room, username: user.username, password: user.password };
                }
                throw new Error('ชื่อผู้ใช้หรือรหัสผ่านไม่ถูกต้อง');
            },
            
            registerTeacher: async (teacherData) => {
                const snapshot = await getDocs(collection(db, 'exam_users'));
                const users = snapshot.docs.map(d => d.data());
                if (users.find(u => u.username === teacherData.username)) {
                    throw new Error('รหัสผู้ใช้นี้มีในระบบแล้ว');
                }
                const newTeacher = {
                    username: teacherData.username,
                    password: teacherData.password,
                    name: teacherData.name,
                    role: 'teacher'
                };
                const docRef = await addDoc(collection(db, 'exam_users'), newTeacher);
                return { id: docRef.id, ...newTeacher };
            },

            getExams: async (userId, role) => {
                const examsSnapshot = await getDocs(collection(db, 'exam_exams'));
                const allExams = examsSnapshot.docs.map(d => ({ id: d.id, ...d.data() }));
                
                if (role === 'teacher') {
                    return allExams;
                } else {
                    const allowedExams = allExams.filter(ex => ex.allowedStudentIds && ex.allowedStudentIds.includes(userId));
                    const sessionsSnapshot = await getDocs(query(collection(db, 'exam_sessions'), where('userId', '==', userId)));
                    const userSessions = sessionsSnapshot.docs.map(d => ({ id: d.id, ...d.data() }));
                    
                    const sessionIds = userSessions.map(s => s.id);
                    let userSubs = [];
                    if (sessionIds.length > 0) {
                         const subsSnapshot = await getDocs(collection(db, 'exam_submissions'));
                         userSubs = subsSnapshot.docs.map(d => ({ id: d.id, ...d.data() })).filter(sub => sessionIds.includes(sub.sessionId));
                    }

                    return allowedExams.map(ex => {
                        const session = userSessions.find(s => s.examId === ex.id);
                        const submission = session ? userSubs.find(sub => sub.sessionId === session.id) : null;
                        return { ...ex, session, submission };
                    });
                }
            },

            startSession: async (userId, examId) => {
                const q = query(collection(db, 'exam_sessions'), where('userId', '==', userId), where('examId', '==', examId));
                const sessionsSnapshot = await getDocs(q);
                let sessionDoc = sessionsSnapshot.docs[0];
                
                if (!sessionDoc) {
                    const examsSnapshot = await getDocs(collection(db, 'exam_exams'));
                    const examDoc = examsSnapshot.docs.find(d => d.id === examId);
                    const exam = { id: examDoc.id, ...examDoc.data() };
                    
                    const now = Date.now();
                    const randomFileIndex = Math.floor(Math.random() * (exam.fileSets?.length || 1));
                    const assignedFile = exam.fileSets ? exam.fileSets[randomFileIndex] : { name: 'Default_Exam.pdf', url: '' };

                    const newSession = {
                        userId,
                        examId,
                        startTime: now,
                        endTime: now + (exam.durationMinutes * 60 * 1000),
                        assignedFile: assignedFile
                    };
                    const docRef = await addDoc(collection(db, 'exam_sessions'), newSession);
                    return { id: docRef.id, ...newSession };
                }
                return { id: sessionDoc.id, ...sessionDoc.data() };
            },

            submitAnswer: async (sessionId, fileObject) => {
                const sessionsSnapshot = await getDocs(collection(db, 'exam_sessions'));
                const sessionDoc = sessionsSnapshot.docs.find(d => d.id === sessionId);
                if (!sessionDoc) throw new Error('ไม่พบข้อมูลการสอบ');
                const session = { id: sessionDoc.id, ...sessionDoc.data() };
                
                const serverTime = Date.now();
                const examsSnapshot = await getDocs(collection(db, 'exam_exams'));
                const examDoc = examsSnapshot.docs.find(d => d.id === session.examId);
                const exam = examDoc.data();
                
                const isLate = serverTime > session.endTime;

                if (isLate && !exam.allowLateSubmission) {
                    throw new Error('หมดเวลาส่งข้อสอบแล้ว ระบบปฏิเสธการรับไฟล์');
                }

                let fileUrl = '';
                if (fileObject) {
                    const storageRef = ref(storage, `submissions/${sessionId}_${Date.now()}_${fileObject.name}`);
                    await uploadBytes(storageRef, fileObject);
                    fileUrl = await getDownloadURL(storageRef);
                }

                const submission = {
                    sessionId,
                    fileName: fileObject ? fileObject.name : 'Unknown',
                    fileUrl: fileUrl,
                    submittedAt: serverTime,
                    isLate: isLate,
                    score: null
                };
                const docRef = await addDoc(collection(db, 'exam_submissions'), submission);
                submission.id = docRef.id;
                return submission;
            },

            createExam: async (examData, fileObjects) => {
                const fileSets = [];
                if (fileObjects && fileObjects.length > 0) {
                    for (const file of fileObjects) {
                        const storageRef = ref(storage, `exams/${Date.now()}_${file.name}`);
                        await uploadBytes(storageRef, file);
                        const url = await getDownloadURL(storageRef);
                        fileSets.push({ name: file.name, url: url });
                    }
                } else {
                    fileSets.push({ name: 'Default_Exam.pdf', url: '' });
                }

                const newExam = {
                    title: examData.title,
                    durationMinutes: examData.durationMinutes,
                    description: examData.description,
                    fileSets: fileSets,
                    allowLateSubmission: examData.allowLateSubmission,
                    allowedStudentIds: examData.allowedStudentIds || [] 
                };
                const docRef = await addDoc(collection(db, 'exam_exams'), newExam);
                return { id: docRef.id, ...newExam };
            },

            getExamResults: async (examId) => {
                const usersSnapshot = await getDocs(query(collection(db, 'exam_users'), where('role', '==', 'student')));
                const allUsers = usersSnapshot.docs.map(d => ({ id: d.id, ...d.data() }));
                
                const examsSnapshot = await getDocs(collection(db, 'exam_exams'));
                const examDoc = examsSnapshot.docs.find(d => d.id === examId);
                const exam = examDoc.data();
                
                const sessionsSnapshot = await getDocs(query(collection(db, 'exam_sessions'), where('examId', '==', examId)));
                const examSessions = sessionsSnapshot.docs.map(d => ({ id: d.id, ...d.data() }));
                
                const subsSnapshot = await getDocs(collection(db, 'exam_submissions'));
                const allSubs = subsSnapshot.docs.map(d => ({ id: d.id, ...d.data() }));

                const allowedStudents = allUsers.filter(u => exam.allowedStudentIds && exam.allowedStudentIds.includes(u.id));
                
                const results = allowedStudents.map(student => {
                    const session = examSessions.find(s => s.userId === student.id);
                    const submission = session ? allSubs.find(sub => sub.sessionId === session.id) : null;
                    
                    let status = 'ยังไม่เริ่มสอบ';
                    if (session) {
                        if (submission) {
                            status = submission.isLate ? 'ส่งแล้ว (ล่าช้า)' : 'ส่งแล้ว';
                        } else if (Date.now() > session.endTime && !exam.allowLateSubmission) {
                            status = 'หมดเวลา/ไม่ส่ง';
                        } else if (Date.now() > session.endTime && exam.allowLateSubmission) {
                            status = 'หมดเวลา (รอดำเนินการส่งล่าช้า)';
                        } else {
                            status = 'กำลังทำข้อสอบ';
                        }
                    }

                    return {
                        studentId: student.username,
                        studentName: student.name,
                        grade: student.grade,
                        room: student.room,
                        startTime: session ? session.startTime : null,
                        assignedFile: session ? session.assignedFile : '-',
                        submission: submission || null,
                        status: status
                    };
                });
                return results;
            },

            updateScore: async (submissionId, score) => {
                const subRef = doc(db, 'exam_submissions', submissionId);
                await updateDoc(subRef, { score: Number(score) });
            },

            getStudents: async () => {
                const usersSnapshot = await getDocs(query(collection(db, 'exam_users'), where('role', '==', 'student')));
                return usersSnapshot.docs.map(d => ({ id: d.id, ...d.data() }));
            },

            addStudent: async (studentData) => {
                const usersSnapshot = await getDocs(collection(db, 'exam_users'));
                const existingUser = usersSnapshot.docs.find(d => d.data().username === studentData.username);
                
                if (existingUser) throw new Error('รหัสผู้ใช้นี้มีในระบบแล้ว');

                const newStudent = {
                    username: studentData.username,
                    password: studentData.password,
                    name: studentData.name,
                    role: 'student',
                    grade: studentData.grade,
                    room: studentData.room
                };
                const docRef = await addDoc(collection(db, 'exam_users'), newStudent);
                return { id: docRef.id, ...newStudent };
            },

            bulkAddStudents: async (studentsArray) => {
                const usersSnapshot = await getDocs(collection(db, 'exam_users'));
                const existingUsernames = new Set(usersSnapshot.docs.map(d => d.data().username));
                
                const validStudents = studentsArray.filter(s => 
                    s.username && s.name && !existingUsernames.has(s.username.toString())
                );

                if (validStudents.length === 0) throw new Error('ไม่มีข้อมูลที่สามารถเพิ่มได้ (อาจซ้ำกับในระบบทั้งหมด หรือไฟล์ว่างเปล่า)');

                const batch = writeBatch(db);
                validStudents.forEach(student => {
                    const docRef = doc(collection(db, 'exam_users'));
                    batch.set(docRef, {
                        username: student.username.toString(),
                        password: student.password ? student.password.toString() : '1234',
                        name: student.name,
                        role: 'student',
                        grade: student.grade || '-',
                        room: student.room || '-'
                    });
                });
                await batch.commit();
                return validStudents.length;
            },

            updateUser: async (userId, updateData) => {
                const userRef = doc(db, 'exam_users', userId);
                await updateDoc(userRef, updateData);
            }
        };

        // ---------------------------------------------------------
        // UI COMPONENTS
        // ---------------------------------------------------------

        const ProfileModal = ({ user, onClose, onUpdateProfile, onShowNotification }) => {
            const [name, setName] = useState(user.name || '');
            const [password, setPassword] = useState(user.password || '');
            const [isLoading, setIsLoading] = useState(false);

            const handleSubmit = async (e) => {
                e.preventDefault();
                setIsLoading(true);
                try {
                    await api.updateUser(user.id, { name, password });
                    onUpdateProfile({ ...user, name, password });
                    onShowNotification('อัปเดตข้อมูลส่วนตัวสำเร็จ', 'success');
                    onClose();
                } catch (error) {
                    onShowNotification('เกิดข้อผิดพลาด: ' + error.message, 'error');
                } finally {
                    setIsLoading(false);
                }
            };

            return (
                <div className="fixed inset-0 z-[60] flex items-center justify-center p-4 bg-slate-900/60 backdrop-blur-sm">
                    <div className="bg-white rounded-3xl w-full max-w-md p-8 shadow-2xl transform transition-all animate-in fade-in zoom-in duration-300">
                        <div className="flex justify-between items-center mb-6">
                            <h2 className="text-2xl font-extrabold text-slate-800">แก้ไขข้อมูลส่วนตัว</h2>
                            <button onClick={onClose} className="text-slate-400 hover:text-slate-600 focus:outline-none"><i className="fa-solid fa-xmark text-2xl"></i></button>
                        </div>
                        <form onSubmit={handleSubmit} className="space-y-5">
                            <div>
                                <label className="block text-base font-bold text-slate-700 mb-2">ชื่อ - นามสกุล</label>
                                <input type="text" required value={name} onChange={e => setName(e.target.value)} className="w-full px-5 py-4 bg-slate-50 border border-slate-200 rounded-xl focus:ring-4 focus:ring-indigo-500/20 focus:border-indigo-500 outline-none font-bold text-slate-800 transition-all text-lg" />
                            </div>
                            <div>
                                <label className="block text-base font-bold text-slate-700 mb-2">รหัสผ่าน</label>
                                <input type="text" required value={password} onChange={e => setPassword(e.target.value)} className="w-full px-5 py-4 bg-slate-50 border border-slate-200 rounded-xl focus:ring-4 focus:ring-indigo-500/20 focus:border-indigo-500 outline-none font-bold text-slate-800 transition-all text-lg" />
                            </div>
                            <button type="submit" disabled={isLoading} className="w-full mt-4 py-4 bg-indigo-600 text-white rounded-xl hover:bg-indigo-700 font-extrabold text-lg transition-all active:scale-95 shadow-md">
                                {isLoading ? <><i className="fa-solid fa-spinner animate-spin mr-2"></i> กำลังบันทึก...</> : 'บันทึกการเปลี่ยนแปลง'}
                            </button>
                        </form>
                    </div>
                </div>
            );
        };

        const Notification = ({ message, type, onClose }) => {
            if (!message) return null;
            const bgColor = type === 'error' ? 'bg-rose-50 border-rose-500 text-rose-700' : 'bg-emerald-50 border-emerald-500 text-emerald-700';
            const Icon = type === 'error' ? 'fa-circle-exclamation' : 'fa-circle-check';
            
            return (
                <div className={`fixed top-6 right-6 z-50 flex items-center p-4 border-l-4 rounded-xl shadow-xl transition-all duration-300 transform translate-y-0 ${bgColor} text-lg`}>
                    <i className={`fa-solid ${Icon} text-2xl mr-3`}></i>
                    <span className="font-semibold">{message}</span>
                    <button onClick={onClose} className="ml-6 text-gray-400 hover:text-gray-600 focus:outline-none"><i className="fa-solid fa-xmark"></i></button>
                </div>
            );
        };

        const InstructionModal = ({ role, onAccept }) => {
            return (
                <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/60 backdrop-blur-sm">
                    <div className="bg-white rounded-3xl w-full max-w-lg p-10 shadow-2xl transform transition-all animate-in fade-in zoom-in duration-300">
                        <div className="flex items-center justify-center w-20 h-20 rounded-full bg-blue-100 text-blue-600 mx-auto mb-8">
                            <i className="fa-solid fa-circle-info text-4xl"></i>
                        </div>
                        <h2 className="text-3xl font-extrabold text-center text-slate-800 mb-8">คำชี้แจงการใช้งานระบบ</h2>
                        
                        {role === 'student' ? (
                            <div className="space-y-6 text-slate-600 mb-10 font-medium text-lg">
                                <div className="flex items-start">
                                    <i className="fa-solid fa-circle-check text-emerald-500 text-2xl mr-4 mt-0.5 flex-shrink-0"></i>
                                    <p>ระบบจะเริ่มจับเวลา <span className="font-extrabold text-rose-500">ทันที</span> ที่คุณกดปุ่ม "ดาวน์โหลดข้อสอบ"</p>
                                </div>
                                <div className="flex items-start">
                                    <i className="fa-solid fa-circle-check text-emerald-500 text-2xl mr-4 mt-0.5 flex-shrink-0"></i>
                                    <p>หากอินเทอร์เน็ตขัดข้องหรือเผลอปิดหน้าเว็บ คุณสามารถล็อกอินเข้ามาทำต่อได้ (แต่เวลาจะยังคงเดินอย่างต่อเนื่อง)</p>
                                </div>
                                <div className="flex items-start">
                                    <i className="fa-solid fa-circle-check text-emerald-500 text-2xl mr-4 mt-0.5 flex-shrink-0"></i>
                                    <p>ตรวจสอบไฟล์คำตอบให้ถูกต้องก่อนกดส่งทุกครั้ง</p>
                                </div>
                            </div>
                        ) : (
                            <div className="space-y-6 text-slate-600 mb-10 font-medium text-lg">
                                <div className="flex items-start">
                                    <i className="fa-solid fa-circle-check text-indigo-500 text-2xl mr-4 mt-0.5 flex-shrink-0"></i>
                                    <p>ผู้สอนต้องเพิ่มรายชื่อนักเรียนเข้าระบบกลาง ก่อนจึงจะสามารถกำหนดสิทธิ์เข้าสอบได้</p>
                                </div>
                                <div className="flex items-start">
                                    <i className="fa-solid fa-circle-check text-indigo-500 text-2xl mr-4 mt-0.5 flex-shrink-0"></i>
                                    <p>สามารถอัปโหลดไฟล์ข้อสอบได้หลายชุด ระบบจะทำการสุ่มแจกให้นักเรียนอัตโนมัติ</p>
                                </div>
                                <div className="flex items-start">
                                    <i className="fa-solid fa-circle-check text-indigo-500 text-2xl mr-4 mt-0.5 flex-shrink-0"></i>
                                    <p>ระบบเชื่อมต่อกับฐานข้อมูลเรียบร้อยแล้ว ทุกการกระทำจะถูกบันทึกจริง</p>
                                </div>
                            </div>
                        )}

                        <button onClick={onAccept} className="w-full py-5 rounded-2xl text-white font-extrabold text-xl bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-700 hover:to-indigo-700 shadow-xl shadow-blue-500/30 transition-all active:scale-95">
                            ฉันรับทราบและเข้าใจแล้ว
                        </button>
                    </div>
                </div>
            );
        };

        const LoginView = ({ onLogin }) => {
            const [isRegistering, setIsRegistering] = useState(false);
            const [username, setUsername] = useState('');
            const [password, setPassword] = useState('');
            const [regName, setRegName] = useState('');
            const [regUsername, setRegUsername] = useState('');
            const [regPassword, setRegPassword] = useState('');
            const [isLoading, setIsLoading] = useState(false);
            const [error, setError] = useState('');

            const handleLoginSubmit = async (e) => {
                e.preventDefault();
                setIsLoading(true);
                setError('');
                try {
                    const user = await api.login(username, password);
                    onLogin(user);
                } catch (err) {
                    setError(err.message);
                } finally {
                    setIsLoading(false);
                }
            };

            const handleRegisterSubmit = async (e) => {
                e.preventDefault();
                setIsLoading(true);
                setError('');
                try {
                    await api.registerTeacher({ name: regName, username: regUsername, password: regPassword });
                    setIsRegistering(false);
                    setUsername(regUsername);
                    setPassword(regPassword);
                    setError('ลงทะเบียนครูผู้สอนสำเร็จ! กรุณาเข้าสู่ระบบ');
                } catch (err) {
                    setError(err.message);
                } finally {
                    setIsLoading(false);
                }
            };

            return (
                <div className="flex min-h-screen bg-slate-50 relative overflow-hidden">
                    <div className="absolute top-[-10%] left-[-10%] w-[40%] h-[40%] bg-blue-400/20 rounded-full blur-3xl animate-pulse"></div>
                    <div className="absolute bottom-[-10%] right-[-10%] w-[40%] h-[40%] bg-indigo-400/20 rounded-full blur-3xl animate-pulse" style={{animationDelay: '1s'}}></div>

                const s = totalSeconds % 60;

                                                        <div className="grid grid-cols-2 gap-8">
                                                            <div>
                                                                <label className="block text-base font-bold text-slate-700 mb-3">ระดับชั้น</label>
                                                                <input type="text" required value={editingStudent.grade} onChange={e => setEditingStudent({...editingStudent, grade: e.target.value})} className="w-full px-6 py-4 bg-slate-50 border border-slate-200 rounded-2xl focus:ring-4 focus:ring-amber-500/20 focus:border-amber-500 outline-none font-bold text-slate-800 text-lg transition-all" />
                                                            </div>
                                                            <div>
                                                                <label className="block text-base font-bold text-slate-700 mb-3">ห้อง</label>
                                                                <input type="text" required value={editingStudent.room} onChange={e => setEditingStudent({...editingStudent, room: e.target.value})} className="w-full px-6 py-4 bg-slate-50 border border-slate-200 rounded-2xl focus:ring-4 focus:ring-amber-500/20 focus:border-amber-500 outline-none font-bold text-slate-800 text-lg transition-all" />
                                                            </div>
                                                        </div>
                                                        <div>
                                                            <label className="block text-base font-bold text-slate-700 mb-3">รหัสผ่าน</label>
                                                            <input type="text" required value={editingStudent.password} onChange={e => setEditingStudent({...editingStudent, password: e.target.value})} className="w-full px-6 py-4 bg-slate-50 border border-slate-200 rounded-2xl focus:ring-4 focus:ring-amber-500/20 focus:border-amber-500 outline-none font-bold text-slate-800 text-lg transition-all" />
                                                        </div>
                                                    </div>

                                                    <button type="submit" disabled={isLoading} className="w-full mt-10 py-5 text-white rounded-2xl font-extrabold text-xl transition-all active:scale-95 shadow-xl bg-gradient-to-r from-amber-500 to-orange-500 hover:shadow-amber-500/40">
                                                        {isLoading ? <><i className="fa-solid fa-spinner animate-spin mr-2"></i> กำลังบันทึก...</> : 'บันทึกการเปลี่ยนแปลง'}
                                                    </button>
                                                </form>
                                            </div>
                                        )}

                                        {studentView === 'create' && (
                                            <div className="max-w-4xl mx-auto animate-in slide-in-from-right-8 duration-300">
                                                <div className="flex items-center mb-10 border-b border-slate-100 pb-8">
                                                    <button onClick={() => setStudentView('list')} className="p-4 mr-6 rounded-2xl bg-slate-50 text-slate-500 hover:bg-slate-200 hover:text-slate-800 transition-colors border border-slate-200">
                                                        <i className="fa-solid fa-arrow-left text-2xl"></i>
                                                    </button>
                                                    <div>
                                                        <h2 className="text-3xl font-extrabold text-slate-800">เพิ่มรายชื่อนักเรียนใหม่</h2>
                                                        <p className="text-slate-500 font-semibold mt-2 text-lg">เลือกลงทะเบียนทีละคน หรือนำเข้าจากไฟล์ Excel/CSV</p>
                                                    </div>
                                                </div>

                                                <div className="flex mb-8 bg-slate-100 p-2 rounded-2xl w-fit">
                                                    <button type="button" onClick={() => setStudentInputMode('single')} className={`px-6 py-3 rounded-xl font-extrabold text-base transition-all ${studentInputMode === 'single' ? 'bg-white text-indigo-600 shadow-sm' : 'text-slate-500 hover:text-slate-700'}`}>เพิ่มทีละคน</button>
                                                    <button type="button" onClick={() => setStudentInputMode('bulk')} className={`px-6 py-3 rounded-xl font-extrabold text-base transition-all ${studentInputMode === 'bulk' ? 'bg-white text-emerald-600 shadow-sm' : 'text-slate-500 hover:text-slate-700'}`}>นำเข้าหลายคน (CSV)</button>
                                                </div>

                                                {studentInputMode === 'single' ? (
                                                    <form onSubmit={handleAddStudent} className="bg-white p-10 rounded-[2.5rem] border border-slate-200 shadow-sm relative overflow-hidden">
                                                        <div className="absolute top-0 left-0 w-full h-2 bg-indigo-500"></div>
                                                        <div className="space-y-6">
                                                            <div>
                                                                <label className="block text-base font-bold text-slate-700 mb-3">รหัสประจำตัว (Username)</label>
                                                                <input type="text" required value={newStudentUsername} onChange={e => setNewStudentUsername(e.target.value)} className="w-full px-6 py-4 bg-slate-50 border border-slate-200 rounded-2xl focus:ring-4 focus:ring-indigo-500/20 focus:border-indigo-500 outline-none font-bold text-slate-800 text-lg transition-all" placeholder="เช่น 64001"/>
                                                            </div>
                                                            <div>
                                                                <label className="block text-base font-bold text-slate-700 mb-3">ชื่อ-นามสกุล</label>
                                                                <input type="text" required value={newStudentName} onChange={e => setNewStudentName(e.target.value)} className="w-full px-6 py-4 bg-slate-50 border border-slate-200 rounded-2xl focus:ring-4 focus:ring-indigo-500/20 focus:border-indigo-500 outline-none font-bold text-slate-800 text-lg transition-all" placeholder="เช่น เด็กชายเรียนดี มีวินัย" />
                                                            </div>
                                                            <div className="grid grid-cols-2 gap-8">
                                                                <div>
                                                                    <label className="block text-base font-bold text-slate-700 mb-3">ระดับชั้น</label>
                                                                    <input type="text" value={newStudentGrade} onChange={e => setNewStudentGrade(e.target.value)} className="w-full px-6 py-4 bg-slate-50 border border-slate-200 rounded-2xl focus:ring-4 focus:ring-indigo-500/20 focus:border-indigo-500 outline-none font-bold text-slate-800 text-lg transition-all" placeholder="เช่น ม.4" />
                                                                </div>
                                                                <div>
                                                                    <label className="block text-base font-bold text-slate-700 mb-3">ห้อง</label>
                                                                    <input type="text" value={newStudentRoom} onChange={e => setNewStudentRoom(e.target.value)} className="w-full px-6 py-4 bg-slate-50 border border-slate-200 rounded-2xl focus:ring-4 focus:ring-indigo-500/20 focus:border-indigo-500 outline-none font-bold text-slate-800 text-lg transition-all" placeholder="เช่น 1" />
                                                                </div>
                                                            </div>
                                                            <div>
                                                                <label className="block text-base font-bold text-slate-700 mb-3">ตั้งรหัสผ่านเริ่มต้น</label>
                                                                <input type="text" required value={newStudentPassword} onChange={e => setNewStudentPassword(e.target.value)} className="w-full px-6 py-4 bg-slate-50 border border-slate-200 rounded-2xl focus:ring-4 focus:ring-indigo-500/20 focus:border-indigo-500 outline-none font-bold text-slate-800 text-lg transition-all" />
                                                            </div>
                                                        </div>
                                                        <button type="submit" disabled={isLoading} className="w-full mt-10 py-5 bg-indigo-600 text-white rounded-2xl hover:bg-indigo-700 font-extrabold text-xl transition-all shadow-xl shadow-indigo-600/20 active:scale-95">
                                                            {isLoading ? <><i className="fa-solid fa-spinner animate-spin mr-2"></i> กำลังบันทึก...</> : 'บันทึกข้อมูลนักเรียน'}
                                                        </button>
                                                    </form>
                                                ) : (
                                                    <div className="bg-white p-10 rounded-[2.5rem] border border-slate-200 shadow-sm relative overflow-hidden">
                                                        <div className="absolute top-0 left-0 w-full h-2 bg-emerald-500"></div>
                                                        <div className="mb-8 p-6 bg-slate-50 rounded-2xl border border-slate-200">
                                                            <h3 className="text-xl font-extrabold text-slate-800 mb-2">1. ดาวน์โหลดไฟล์ต้นแบบ</h3>
                                                            <p className="text-slate-600 font-medium mb-4">ดาวน์โหลดไฟล์ CSV นี้ไปเปิดใน Excel แล้วกรอกข้อมูลนักเรียนให้ครบตามคอลัมน์ จากนั้นบันทึกเป็นไฟล์ .csv เพื่อนำมาอัปโหลด</p>
                                                            <button type="button" onClick={handleDownloadTemplate} className="px-6 py-3 bg-white border-2 border-slate-200 text-slate-700 font-extrabold rounded-xl hover:bg-slate-100 transition-colors active:scale-95 shadow-sm">
                                                                <i className="fa-solid fa-download mr-2"></i> โหลดเทมเพลต (student_template.csv)
                                                            </button>
                                                        </div>

                                                        <div>
                                                            <h3 className="text-xl font-extrabold text-slate-800 mb-4">2. อัปโหลดไฟล์ CSV</h3>
                                                            <input type="file" accept=".csv" onChange={(e) => {
                                                                const file = e.target.files[0];
                                                                if (file) {
                                                                    const reader = new FileReader();
                                                                    reader.onload = (event) => setCsvData(event.target.result);
                                                                    reader.readAsText(file);
                                                                }
                                                            }} className="block w-full text-base text-slate-500 file:mr-6 file:py-3 file:px-8 file:rounded-2xl file:border-0 file:text-base file:font-extrabold file:bg-emerald-50 file:text-emerald-700 hover:file:bg-emerald-100 cursor-pointer file:transition-colors file:shadow-sm mb-6 bg-slate-50 p-4 rounded-2xl border border-slate-200" />
                                                            
                                                            <button type="button" onClick={handleBulkImport} disabled={!csvData || isLoading} className={`w-full py-5 rounded-2xl font-extrabold text-xl transition-all shadow-xl active:scale-95 ${!csvData || isLoading ? 'bg-slate-300 text-slate-500 cursor-not-allowed' : 'bg-emerald-600 text-white hover:bg-emerald-700 shadow-emerald-600/20'}`}>
                                                                {isLoading ? <><i className="fa-solid fa-spinner animate-spin mr-2"></i> กำลังนำเข้าข้อมูล...</> : <><i className="fa-solid fa-cloud-arrow-up mr-2"></i> เริ่มนำเข้าข้อมูล</>}
                                                            </button>
                                                        </div>
                                                    </div>
                                                )}
                                            </div>
                                        )}
                                    </>
                                )}
                            </>
                        )}
                    </div>
                    {showProfile && <ProfileModal user={user} onClose={() => setShowProfile(false)} onUpdateProfile={onUpdateUser} onShowNotification={onShowNotification} />}
                </div>
            );
        };

        const App = () => {
            const [user, setUser] = useState(null);
            const [exams, setExams] = useState([]);
            const [currentView, setCurrentView] = useState('login'); 
            const [activeExam, setActiveExam] = useState(null);
            const [activeSession, setActiveSession] = useState(null);
            const [showInstructions, setShowInstructions] = useState(false);
            const [notification, setNotification] = useState({ message: '', type: '' });
            const [isFirebaseReady, setIsFirebaseReady] = useState(false);

            useEffect(() => {
                const initAuth = async () => {
                    try {
                        await signInAnonymously(auth);
                        setIsFirebaseReady(true);
                    } catch (error) {
                        console.error("Firebase Auth Error:", error);
                    }
                };
                initAuth();
            }, []);

            const showNotification = (message, type = 'success') => {
                setNotification({ message, type });
                setTimeout(() => setNotification({ message: '', type: '' }), 4000);
            };

            useEffect(() => {
                if (user && user.role === 'student' && currentView === 'dashboard') {
                    api.getExams(user.id, user.role).then(setExams).catch(err => console.error(err));
                }
            }, [user, currentView]);

            const handleLogin = (loggedInUser) => {
                setUser(loggedInUser);
                setShowInstructions(true);
            };

            const proceedToDashboard = () => {
                setShowInstructions(false);
                if (user.role === 'teacher') setCurrentView('teacher_dashboard');
                else setCurrentView('dashboard');
            };

            const handleLogout = () => {
                setUser(null);
                setCurrentView('login');
                setActiveExam(null);
                setActiveSession(null);
                setShowInstructions(false);
            };

            const handleUpdateUser = (updatedUser) => {
                setUser(updatedUser);
            };

            const handleEnterExamRoom = (exam) => {
                setActiveExam(exam);
                setActiveSession(exam.session || null);
                setCurrentView('exam');
            };

            const handleStartSession = async (exam) => {
                const session = await api.startSession(user.id, exam.id);
                setActiveSession(session);
                return session;
            };

            if (!isFirebaseReady) {
                return (
                    <div className="min-h-screen flex items-center justify-center bg-slate-50">
                        <div className="flex flex-col items-center">
                            <i className="fa-solid fa-circle-notch fa-spin text-6xl mb-6 text-indigo-500"></i>
                            <p className="text-slate-600 font-extrabold text-2xl">กำลังเชื่อมต่อระบบฐานข้อมูล...</p>
                        </div>
                    </div>
                );
            }

            return (
                <div className="min-h-screen bg-slate-50 font-sans text-slate-800 selection:bg-indigo-100 selection:text-indigo-900">
                    <Notification message={notification.message} type={notification.type} onClose={() => setNotification({ message: '', type: '' })} />

                    {currentView === 'login' && !showInstructions && <LoginView onLogin={handleLogin} />}
                    
                    {showInstructions && user && (
                        <InstructionModal role={user.role} onAccept={proceedToDashboard} />
                    )}

                    {currentView === 'teacher_dashboard' && user?.role === 'teacher' && !showInstructions && (
                        <TeacherDashboardView user={user} onLogout={handleLogout} onShowNotification={showNotification} onUpdateUser={handleUpdateUser} />
                    )}
                    
                    {currentView === 'dashboard' && user?.role === 'student' && !showInstructions && (
                        <DashboardView user={user} exams={exams} onStartExam={handleEnterExamRoom} onLogout={handleLogout} onShowNotification={showNotification} onUpdateUser={handleUpdateUser} />
                    )}

                    {currentView === 'exam' && user && activeExam && !showInstructions && (
                        <ExamRoomView 
                            user={user} 
                            exam={activeExam} 
                            session={activeSession} 
                            onStartSession={handleStartSession}
                            onBack={() => {
                                setCurrentView('dashboard');
                                setActiveExam(null);
                                setActiveSession(null);
                            }}
                            onShowNotification={showNotification}
                        />
                    )}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
