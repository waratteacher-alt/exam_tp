<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ExamOnline - ระบบทดสอบออนไลน์</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap');

        html { font-size: 15px; scroll-behavior: smooth; } 
        body { 
            font-family: 'Prompt', sans-serif; 
            color: #334155; 
            margin: 0; 
            padding: 0; 
            min-height: 100vh;
            background-color: #f8fafc;
            /* เพิ่ม Pattern พื้นหลังอ่อนๆ ให้ดูมีมิติ */
            background-image: radial-gradient(#cbd5e1 1px, transparent 1px);
            background-size: 24px 24px;
        }
        
        /* สไตล์การ์ดขอบมน เงาฟุ้ง */
        .modern-card { 
            background: rgba(255, 255, 255, 0.95); 
            backdrop-filter: blur(10px);
            border: 1px solid rgba(226, 232, 240, 0.8); 
            border-radius: 1.5rem; 
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.01); 
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); 
        }
        .modern-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 8px 10px -6px rgba(0, 0, 0, 0.05);
        }

        /* ปุ่มสไตล์ 3D (กดแล้วยุบ) ดูน่ารักแต่ไม่ทิ้งความ Professional */
        .btn-3d {
            transition: all 0.1s ease;
            position: relative;
        }
        .btn-3d:active:not(:disabled) {
            transform: translateY(4px);
            box-shadow: 0 0px 0 0 transparent !important;
        }
        .btn-3d:disabled {
            opacity: 0.7;
            cursor: not-allowed;
            transform: translateY(4px);
            box-shadow: 0 0px 0 0 transparent !important;
        }

        .primary-gradient { background: linear-gradient(135deg, #4f46e5 0%, #3b82f6 100%); }
        .primary-gradient-text { 
            background: linear-gradient(135deg, #4f46e5 0%, #3b82f6 100%); 
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .checkbox-wrapper input:checked + div { background-color: #4f46e5; border-color: #4f46e5; }
        .checkbox-wrapper input:checked + div i { display: block; transform: scale(1); opacity: 1; }
        .checkbox-wrapper div i { transform: scale(0.5); opacity: 0; transition: all 0.2s; }
        
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }

        /* Loader เด้งดึ๋ง */
        .dot-pulse {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }
        .dot-pulse div {
            width: 10px;
            height: 10px;
            background-color: currentColor;
            border-radius: 50%;
            animation: pulse 1s infinite alternate;
        }
        .dot-pulse div:nth-child(2) { animation-delay: 0.2s; }
        .dot-pulse div:nth-child(3) { animation-delay: 0.4s; }
        @keyframes pulse {
            0% { transform: scale(0.8); opacity: 0.5; }
            100% { transform: scale(1.2); opacity: 1; }
        }

        /* Loading Overlay เต็มจอ */
        .loading-overlay {
            position: fixed;
            inset: 0;
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(5px);
            z-index: 9999;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes float { 0% { transform: translateY(0px); } 50% { transform: translateY(-10px); } 100% { transform: translateY(0px); } }
        .animate-float { animation: float 3s ease-in-out infinite; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel" data-type="module">
        const { useState, useEffect, useRef } = React;

        // ==========================================
        // ⚠️ วาง URL ของ Google Apps Script ที่นี่
        // ==========================================
        const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxdWB8xl_FbXH5BWFeGElkCycH3yLvYH5MIr7N5TNwR8p11RucwoHsbEFGwglY_5GnZ/exec";

        // Helper: แปลงไฟล์เป็น Base64
        const fileToBase64 = (file) => {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = () => resolve({ name: file.name, mimeType: file.type, base64: reader.result });
                reader.onerror = error => reject(error);
            });
        };

        // ---------------------------------------------------------
        // API LAYER
        // ---------------------------------------------------------
        const api = {
            call: async (action, payload = {}) => {
                try {
                    const response = await fetch(GOOGLE_SCRIPT_URL, {
                        method: 'POST',
                        body: JSON.stringify({ action, payload })
                    });
                    const result = await response.json();
                    if (!result.success) throw new Error(result.error);
                    return result.data;
                } catch (e) {
                    throw new Error(e.message || "เกิดข้อผิดพลาดในการเชื่อมต่อกับเซิร์ฟเวอร์");
                }
            },
            
            login: async (username, password) => api.call('login', { username, password }),
            registerTeacher: async (data) => api.call('registerTeacher', data),
            updateProfilePic: async (userId, base64) => api.call('updateProfilePic', { userId, base64 }),
            getExams: async (userId, role) => api.call('getExams', { userId, role }),
            startSession: async (userId, examId) => api.call('startSession', { userId, examId }),
            submitAnswer: async (sessionId, file) => {
                const fileData = await fileToBase64(file);
                return api.call('submitAnswer', { sessionId, file: fileData });
            },
            createExam: async (examData, files) => {
                const filesData = await Promise.all(files.map(f => fileToBase64(f)));
                return api.call('createExam', { examData, files: filesData });
            },
            getExamResults: async (examId) => api.call('getExamResults', { examId }),
            updateScore: async (submissionId, score) => api.call('updateScore', { submissionId, score }),
            getStudents: async () => api.call('getStudents'),
            addStudent: async (data) => api.call('addStudent', data),
            bulkAddStudents: async (dataArray) => api.call('bulkAddStudents', dataArray),
            updateUser: async (userId, updateData) => api.call('updateUser', { userId, updateData }),
            deleteUser: async (userId) => api.call('deleteUser', { userId })
        };

        // ---------------------------------------------------------
        // COMPONENTS ทั่วไป
        // ---------------------------------------------------------
        const Notification = ({ message, type, onClose }) => {
            if (!message) return null;
            const isError = type === 'error';
            return (
                <div className={`fixed top-6 right-6 z-[100] flex items-center p-4 border rounded-2xl shadow-xl transition-all duration-300 animate-in slide-in-from-top-5 max-w-sm ${isError ? 'bg-white border-rose-200 text-rose-700' : 'bg-white border-emerald-200 text-emerald-700'}`}>
                    <div className={`flex items-center justify-center w-10 h-10 rounded-full mr-3 ${isError ? 'bg-rose-100 text-rose-500' : 'bg-emerald-100 text-emerald-500'}`}>
                        <i className={`fa-solid ${isError ? 'fa-bomb' : 'fa-check'}`}></i>
                    </div>
                    <span className="font-bold flex-1 text-sm">{message}</span>
                    <button onClick={onClose} className="ml-3 w-8 h-8 rounded-full flex items-center justify-center text-slate-400 hover:bg-slate-100 transition-colors"><i className="fa-solid fa-xmark"></i></button>
                </div>
            );
        };

        const GlobalLoader = ({ message }) => (
            <div className="loading-overlay">
                <div className="w-20 h-20 primary-gradient text-white rounded-3xl flex items-center justify-center text-4xl shadow-xl animate-float mb-6 transform rotate-12">
                    <i className="fa-solid fa-rocket"></i>
                </div>
                <h3 className="text-xl font-bold text-slate-800 mb-4">{message || 'กำลังประมวลผล...'}</h3>
                <div className="dot-pulse text-indigo-500"><div></div><div></div><div></div></div>
            </div>
        );

        const InstructionModal = ({ role, onAccept }) => {
            return (
                <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/60 backdrop-blur-sm">
                    <div className="bg-white rounded-3xl w-full max-w-2xl p-8 animate-in zoom-in-95 duration-200 shadow-2xl relative overflow-hidden">
                        <div className="absolute top-[-50px] right-[-50px] w-40 h-40 bg-indigo-500/10 rounded-full blur-3xl"></div>
                        <div className="flex flex-col items-center mb-6">
                            <div className="w-20 h-20 bg-indigo-50 text-indigo-600 rounded-2xl flex items-center justify-center text-4xl mb-4 shadow-inner transform -rotate-6">
                                <i className="fa-solid fa-book-open-reader"></i>
                            </div>
                            <h2 className="text-2xl font-black text-slate-800">ยินดีต้อนรับสู่ระบบสอบ! 🎉</h2>
                        </div>
                        
                        <div className="space-y-4 mb-8 text-slate-600 font-medium bg-slate-50 p-6 rounded-2xl border border-slate-100">
                            {role === 'student' ? (
                                <>
                                    <div className="flex items-start"><i className="fa-solid fa-clock text-amber-500 mt-1 mr-3 w-5 text-center text-lg"></i><p>เวลาสอบจะเริ่มเดิน <span className="font-bold text-rose-500">ทันที</span> ที่ดาวน์โหลดโจทย์นะ!</p></div>
                                    <div className="flex items-start"><i className="fa-solid fa-wifi text-emerald-500 mt-1 mr-3 w-5 text-center text-lg"></i><p>เน็ตหลุดไม่เป็นไร ล็อกอินเข้ามาทำต่อได้ (แต่เวลาไม่หยุดเดินนะ)</p></div>
                                    <div className="flex items-start"><i className="fa-solid fa-cloud-arrow-up text-blue-500 mt-1 mr-3 w-5 text-center text-lg"></i><p>ไฟล์คำตอบที่ส่ง จะปลิวเข้า Google Drive ของคุณครูโดยตรงเลย</p></div>
                                </>
                            ) : (
                                <>
                                    <div className="flex items-start"><i className="fa-brands fa-google Drive text-green-500 mt-1 mr-3 w-5 text-center text-lg"></i><p>ระบบเชื่อมต่อกับ <b>Google Drive</b> อัตโนมัติ ปลอดภัย หายห่วง!</p></div>
                                    <div className="flex items-start"><i className="fa-solid fa-users text-indigo-500 mt-1 mr-3 w-5 text-center text-lg"></i><p>อย่าลืมเพิ่มรายชื่อเด็กๆ ในเมนู "ฐานข้อมูลนักเรียน" ก่อนสร้างวิชานะครับ</p></div>
                                </>
                            )}
                        </div>
                        <button onClick={onAccept} className="btn-3d w-full py-4 rounded-xl text-white font-bold text-lg primary-gradient shadow-[0_5px_0_#3730a3]">
                            เข้าใจแล้ว ลุยเลย! 🚀
                        </button>
                    </div>
                </div>
            );
        };

        const ProfileModal = ({ user, onClose, onUpdateProfile, onShowNotification }) => {
            const [name, setName] = useState(user.name || ''); 
            const [password, setPassword] = useState(user.password || ''); 
            const [isLoading, setIsLoading] = useState(false);

            const handleSubmit = async (e) => {
                e.preventDefault(); 
                setIsLoading(true);
                try { 
                    await api.updateUser(user.id, { name, password }); 
                    onUpdateProfile({ ...user, name, password }); 
                    onShowNotification('อัปเดตข้อมูลสำเร็จ ✨', 'success'); 
                    onClose(); 
                } 
                catch (error) { onShowNotification('เกิดข้อผิดพลาด: ' + error.message, 'error'); } 
                finally { setIsLoading(false); }
            };
            return (
                <div className="fixed inset-0 z-[60] flex items-center justify-center p-4 bg-slate-900/60 backdrop-blur-sm">
                    <div className="bg-white rounded-3xl shadow-2xl w-full max-w-sm p-8 animate-in zoom-in-95">
                        <div className="flex justify-between items-center mb-6">
                            <h2 className="text-xl font-black text-slate-800"><i className="fa-solid fa-user-pen text-indigo-500 mr-2"></i> โปรไฟล์ของฉัน</h2>
                            <button onClick={onClose} className="w-8 h-8 bg-slate-100 rounded-full text-slate-400 hover:text-rose-500 hover:bg-rose-50 transition-colors"><i className="fa-solid fa-xmark"></i></button>
                        </div>
                        <form onSubmit={handleSubmit} className="space-y-5">
                            <div>
                                <label className="block font-bold text-slate-600 mb-2 text-sm">ชื่อ - นามสกุล</label>
                                <input type="text" required value={name} onChange={e => setName(e.target.value)} className="w-full px-4 py-3 bg-slate-50 border-2 border-slate-200 rounded-xl focus:border-indigo-400 focus:bg-white outline-none font-bold text-slate-700 transition-colors" />
                            </div>
                            <div>
                                <label className="block font-bold text-slate-600 mb-2 text-sm">รหัสผ่านใหม่</label>
                                <input type="text" required value={password} onChange={e => setPassword(e.target.value)} className="w-full px-4 py-3 bg-slate-50 border-2 border-slate-200 rounded-xl focus:border-indigo-400 focus:bg-white outline-none font-bold text-slate-700 transition-colors" />
                            </div>
                            <div className="pt-2">
                                <button type="submit" disabled={isLoading} className="btn-3d w-full py-3 bg-slate-800 text-white rounded-xl font-bold flex justify-center items-center shadow-[0_4px_0_#0f172a]">
                                    {isLoading ? <div className="dot-pulse"><div></div><div></div><div></div></div> : 'เซฟข้อมูล 💾'}
                                </button>
                            </div>
                        </form>
                    </div>
                </div>
            );
        };

        const ImagePreviewModal = ({ src, onClose }) => {
            if (!src) return null;
            return (
                <div className="fixed inset-0 z-[100] flex items-center justify-center p-4 bg-slate-900/90 backdrop-blur-md animate-in fade-in" onClick={onClose}>
                    <div className="relative max-w-4xl max-h-[90vh] flex flex-col items-center">
                        <img src={src} alt="Preview" className="max-w-full max-h-[85vh] rounded-2xl object-contain shadow-2xl ring-4 ring-white/10" onClick={e => e.stopPropagation()} />
                        <button onClick={onClose} className="absolute -top-12 right-0 w-10 h-10 bg-white/20 hover:bg-rose-500 rounded-full flex items-center justify-center text-white transition-colors">
                            <i className="fa-solid fa-xmark text-xl"></i>
                        </button>
                    </div>
                </div>
            );
        };

        // ---------------------------------------------------------
        // ONBOARDING VIEW (หน้าอัปโหลดรูปครั้งแรก)
        // ---------------------------------------------------------
        const OnboardingView = ({ user, onComplete, onShowNotification }) => {
            const [selectedFile, setSelectedFile] = useState(null);
            const [previewUrl, setPreviewUrl] = useState(null);
            const [isUploading, setIsUploading] = useState(false);
            const fileInputRef = useRef(null);

            const handleImageChange = (e) => {
                const file = e.target.files[0];
                if (!file) return;
                
                if (file.size > 10 * 1024 * 1024) {
                    return onShowNotification('ไฟล์แอบใหญ่ไปนิดนึงน้า (ขอไม่เกิน 10MB จ้า) 😅', 'error');
                }
                if (!file.type.startsWith('image/')) return onShowNotification('ต้องเป็นไฟล์รูปภาพเท่านั้นครับ 📸', 'error');
                
                setSelectedFile(file);
                const reader = new FileReader();
                reader.onload = (event) => setPreviewUrl(event.target.result);
                reader.readAsDataURL(file);
            };

            const handleSave = async () => {
                if (!selectedFile) return onShowNotification('อย่าลืมอัปโหลดรูปก่อนน้าาา!', 'error');
                setIsUploading(true);
                try {
                    const res = await api.updateProfilePic(user.id, selectedFile);
                    onShowNotification('แจ่มมาก! บันทึกรูปเรียบร้อย ✨', 'success');
                    onComplete({ ...user, profilePic: res.profilePic });
                } catch (err) { onShowNotification(err.message, 'error'); } 
                finally { setIsUploading(false); }
            };

            return (
                <div className="min-h-screen flex items-center justify-center p-4 relative overflow-hidden">
                    <div className="absolute top-[-10%] right-[-5%] w-64 h-64 bg-indigo-400/20 rounded-full blur-3xl"></div>
                    <div className="absolute bottom-[-10%] left-[-5%] w-64 h-64 bg-pink-400/20 rounded-full blur-3xl"></div>

                    <div className="modern-card w-full max-w-md p-10 text-center relative z-10">
                        <div className="w-20 h-20 primary-gradient text-white rounded-3xl flex items-center justify-center mx-auto mb-6 text-3xl shadow-lg transform rotate-6">
                            <i className="fa-solid fa-camera-retro"></i>
                        </div>
                        <h2 className="text-2xl font-black text-slate-800 mb-2">ก่อนเริ่มใช้งาน 📸</h2>
                        <p className="text-slate-500 text-sm font-medium mb-8">รบกวนอัปโหลดรูปหน้าตรงชัดๆ หน่อยน้า <br/>คุณครูจะได้ให้คะแนนไม่ผิดคนจ้า</p>
                        
                        <div className="mb-8 relative">
                            <input type="file" accept="image/*" ref={fileInputRef} onChange={handleImageChange} className="hidden" />
                            <div onClick={() => fileInputRef.current.click()} className={`mx-auto w-40 h-40 rounded-full border-4 border-dashed flex items-center justify-center cursor-pointer transition-all overflow-hidden relative group ${previewUrl ? 'border-indigo-500 bg-white shadow-xl' : 'border-slate-300 bg-slate-50 hover:bg-indigo-50 hover:border-indigo-300'}`}>
                                {previewUrl ? ( 
                                    <>
                                        <img src={previewUrl} className="w-full h-full object-cover" />
                                        <div className="absolute inset-0 bg-slate-900/60 flex flex-col items-center justify-center opacity-0 group-hover:opacity-100 transition-opacity">
                                            <i className="fa-solid fa-pen text-white mb-1 text-xl"></i>
                                            <span className="text-white text-xs font-bold">เปลี่ยนรูป</span>
                                        </div>
                                    </> 
                                ) : ( 
                                    <div className="text-slate-400 group-hover:text-indigo-500 text-center transition-colors">
                                        <i className="fa-solid fa-image text-3xl mb-2"></i>
                                        <div className="text-xs font-bold">แตะเพื่อเลือกรูป</div>
                                    </div> 
                                )}
                            </div>
                            {previewUrl && <div className="absolute bottom-0 right-1/4 bg-emerald-500 text-white w-8 h-8 rounded-full flex items-center justify-center border-4 border-white shadow-sm"><i className="fa-solid fa-check"></i></div>}
                        </div>
                        <button onClick={handleSave} disabled={!selectedFile || isUploading} className={`btn-3d w-full py-4 rounded-xl font-bold text-lg flex justify-center items-center transition-all ${!selectedFile || isUploading ? 'bg-slate-200 text-slate-400 shadow-[0_4px_0_#cbd5e1]' : 'primary-gradient text-white shadow-[0_5px_0_#3730a3]'}`}>
                            {isUploading ? <div className="dot-pulse"><div></div><div></div><div></div></div> : 'ยืนยันและไปต่อเลย!'}
                        </button>
                    </div>
                </div>
            );
        };

        // ---------------------------------------------------------
        // LOGIN VIEW
        // ---------------------------------------------------------
        const LoginView = ({ onLogin }) => {
            const [isRegistering, setIsRegistering] = useState(false); 
            const [username, setUsername] = useState(''); 
            const [password, setPassword] = useState('');
            const [regName, setRegName] = useState(''); 
            const [regUsername, setRegUsername] = useState(''); 
            const [regPassword, setRegPassword] = useState('');
            const [isLoading, setIsLoading] = useState(false); 
            const [error, setError] = useState('');

            const handleLoginSubmit = async (e) => { 
                e.preventDefault(); setIsLoading(true); setError(''); 
                try { 
                    const user = await api.login(username, password); 
                    localStorage.setItem('exam_user_session', JSON.stringify(user));
                    onLogin(user); 
                } 
                catch (err) { setError(err.message); } 
                finally { setIsLoading(false); } 
            };
            const handleRegisterSubmit = async (e) => { 
                e.preventDefault(); setIsLoading(true); setError(''); 
                try { await api.registerTeacher({ name: regName, username: regUsername, password: regPassword }); setIsRegistering(false); setUsername(regUsername); setPassword(regPassword); setError('ลงทะเบียนสำเร็จ! เข้าสู่ระบบได้เลย 🎉'); } 
                catch (err) { setError(err.message); } 
                finally { setIsLoading(false); } 
            };

            return (
                <div className="flex min-h-screen items-center justify-center p-4 relative overflow-hidden">
                    {/* Elements ตกแต่งพื้นหลัง */}
                    <div className="absolute top-10 left-10 text-6xl opacity-10 animate-float" style={{animationDelay: '0s'}}>✏️</div>
                    <div className="absolute bottom-20 right-20 text-6xl opacity-10 animate-float" style={{animationDelay: '1s'}}>📚</div>
                    <div className="absolute top-1/4 right-10 text-5xl opacity-10 animate-float" style={{animationDelay: '2s'}}>💡</div>

                    <div className="modern-card w-full max-w-md p-10 md:p-12 relative z-10 animate-in zoom-in-95 duration-500">
                        <div className="text-center mb-8">
                            <div className="inline-flex items-center justify-center w-20 h-20 primary-gradient text-white rounded-[1.5rem] mb-6 shadow-lg transform -rotate-6 hover:rotate-0 transition-transform">
                                <i className="fa-solid fa-graduation-cap text-4xl"></i>
                            </div>
                            <h2 className="text-3xl font-black text-slate-800 tracking-tight">Exam<span className="text-indigo-500">Online</span></h2>
                            <p className="text-slate-500 mt-2 font-medium text-sm">{isRegistering ? 'สร้างบัญชีสำหรับคุณครู 👩‍🏫' : 'ระบบทดสอบและประเมินผล 🚀'}</p>
                        </div>

                    for (let i = startIndex; i < rows.length; i++) { const cols = rows[i].split(',').map(c => c.trim()); if (cols.length >= 2) { studentsToAdd.push({ username: cols[0], name: cols[1], grade: cols[2] || '-', room: cols[3] || '-', password: cols[4] || '1234' }); } }

                                    <>
                                        {studentView === 'list' && (
                                            <div className="animate-in fade-in">
                                                <div className="flex justify-between items-center mb-6"><h2 className="text-xl font-black text-slate-800">รายชื่อนักเรียน</h2><button onClick={() => setStudentView('create')} className="btn-3d px-5 py-2.5 bg-indigo-500 text-white rounded-xl font-bold text-sm shadow-[0_4px_0_#3730a3]"><i className="fa-solid fa-user-plus mr-2"></i> เพิ่มคน</button></div>
                                                <div className="overflow-x-auto rounded-2xl border-2 border-slate-100">
                                                    <table className="w-full text-left bg-white whitespace-nowrap">
                                                        <thead className="bg-slate-50 border-b-2 border-slate-100"><tr><th className="p-4 font-bold text-slate-500 text-xs w-14 text-center">รูป</th><th className="p-4 font-bold text-slate-500 text-xs uppercase tracking-wider">รหัส</th><th className="p-4 font-bold text-slate-500 text-xs uppercase tracking-wider">ชื่อ-สกุล</th><th className="p-4 font-bold text-slate-500 text-xs uppercase tracking-wider">ห้อง</th><th className="p-4 font-bold text-slate-500 text-xs uppercase tracking-wider">รหัสผ่าน</th><th className="p-4 font-bold text-slate-500 text-xs uppercase tracking-wider text-right">แอคชัน</th></tr></thead>
                                                        <tbody className="divide-y divide-slate-100 text-sm">
                                                            {students.map(student => (
                                                                <tr key={student.id} className="hover:bg-slate-50/80 transition-colors">
                                                                    <td className="p-3 text-center">
                                                                        <div 
                                                                            className="w-10 h-10 rounded-xl bg-slate-100 border-2 border-slate-200 overflow-hidden mx-auto cursor-pointer hover:border-indigo-400 transition-colors"
                                                                            onClick={() => student.profilePicUrl && setPreviewImage(student.profilePicUrl)}
                                                                            title={student.profilePicUrl ? "คลิกซูม 🔍" : "ไม่มีรูปจ้า"}
                                                                        >
                                                                            {student.profilePicUrl ? <img src={student.profilePicUrl} className="w-full h-full object-cover"/> : <div className="w-full h-full flex items-center justify-center text-slate-300 text-sm"><i className="fa-solid fa-ghost"></i></div>}
                                                                        </div>
                                                                    </td>
                                                                    <td className="p-4 font-black text-indigo-500">{student.username}</td><td className="p-4 font-extrabold text-slate-700">{student.name}</td><td className="p-4 text-slate-500 font-bold text-xs"><span className="bg-slate-100 border border-slate-200 px-2 py-1 rounded">{student.grade}/{student.room}</span></td><td className="p-4 text-slate-400 font-mono text-xs">{student.password}</td>
                                                                    <td className="p-4 text-right">
                                                                        <button onClick={() => { setEditingStudent(student); setStudentView('edit'); }} className="w-8 h-8 bg-white text-slate-500 border-2 border-slate-200 rounded-lg hover:bg-indigo-50 hover:border-indigo-200 hover:text-indigo-600 transition-colors mr-2 btn-3d shadow-sm" title="แก้ไข"><i className="fa-solid fa-pen"></i></button>
                                                                        <button onClick={() => handleDeleteStudent(student.id, student.name)} className="w-8 h-8 bg-white text-slate-500 border-2 border-slate-200 rounded-lg hover:bg-rose-50 hover:border-rose-200 hover:text-rose-600 transition-colors btn-3d shadow-sm" title="ลบทิ้ง"><i className="fa-solid fa-trash"></i></button>
                                                                    </td>
                                                                </tr>
                                                            ))}
                                                        </tbody>
                                                    </table>
                                                    {students.length === 0 && <div className="text-center text-slate-400 py-16 font-bold text-sm bg-slate-50/50">โล่งโจ้งเลย! เพิ่มนักเรียนด่วน 🏃‍♂️</div>}
                                                </div>
                                            </div>
                                        )}

                                        {studentView === 'edit' && editingStudent && (
                                            <div className="max-w-md mx-auto animate-in zoom-in-95 bg-slate-50 border-2 border-slate-100 rounded-3xl p-8 shadow-inner">
                                                <div className="flex items-center mb-6 border-b border-slate-200 pb-4"><button onClick={() => {setStudentView('list'); setEditingStudent(null);}} className="w-10 h-10 rounded-full bg-white text-slate-500 hover:bg-rose-100 hover:text-rose-500 flex items-center justify-center mr-4 transition-colors shadow-sm"><i className="fa-solid fa-arrow-left"></i></button><h2 className="text-lg font-black text-slate-800">แก้ไข: <span className="text-indigo-600">{editingStudent.username}</span></h2></div>
                                                <form onSubmit={handleUpdateStudent} className="space-y-5">
                                                    <div><label className="block text-xs font-bold text-slate-500 mb-1.5 ml-1">ชื่อ-สกุล</label><input type="text" required value={editingStudent.name} onChange={e => setEditingStudent({...editingStudent, name: e.target.value})} className="w-full px-4 py-3 bg-white border-2 border-slate-200 rounded-xl focus:border-indigo-400 outline-none font-bold text-slate-700 text-sm shadow-sm transition-colors" /></div>
                                                    <div className="flex gap-4"><div className="flex-1"><label className="block text-xs font-bold text-slate-500 mb-1.5 ml-1">ชั้น</label><input type="text" required value={editingStudent.grade} onChange={e => setEditingStudent({...editingStudent, grade: e.target.value})} className="w-full px-4 py-3 bg-white border-2 border-slate-200 rounded-xl focus:border-indigo-400 outline-none font-bold text-slate-700 text-sm shadow-sm transition-colors" /></div><div className="flex-1"><label className="block text-xs font-bold text-slate-500 mb-1.5 ml-1">ห้อง</label><input type="text" required value={editingStudent.room} onChange={e => setEditingStudent({...editingStudent, room: e.target.value})} className="w-full px-4 py-3 bg-white border-2 border-slate-200 rounded-xl focus:border-indigo-400 outline-none font-bold text-slate-700 text-sm shadow-sm transition-colors" /></div></div>
                                                    <div><label className="block text-xs font-bold text-slate-500 mb-1.5 ml-1">รหัสผ่าน</label><input type="text" required value={editingStudent.password} onChange={e => setEditingStudent({...editingStudent, password: e.target.value})} className="w-full px-4 py-3 bg-white border-2 border-slate-200 rounded-xl focus:border-indigo-400 outline-none font-bold text-slate-700 text-sm shadow-sm transition-colors" /></div>
                                                    <button type="submit" disabled={isLoading} className="btn-3d w-full py-4 mt-4 primary-gradient text-white rounded-xl font-black text-sm shadow-[0_4px_0_#3730a3]">{isLoading ? <div className="dot-pulse"><div></div><div></div><div></div></div> : 'เซฟข้อมูล 💾'}</button>
                                                </form>
                                            </div>
                                        )}

                                        {studentView === 'create' && (
                                            <div className="max-w-2xl mx-auto animate-in slide-in-from-right-8 bg-white border-2 border-slate-100 rounded-[2rem] p-8 shadow-sm">
                                                <div className="flex items-center justify-between mb-8 border-b border-slate-100 pb-4">
                                                    <div className="flex items-center"><button onClick={() => setStudentView('list')} className="w-10 h-10 rounded-full bg-slate-50 text-slate-500 hover:bg-rose-100 hover:text-rose-500 flex items-center justify-center mr-4 transition-colors"><i className="fa-solid fa-arrow-left"></i></button><h2 className="text-xl font-black text-slate-800">เพิ่มนักเรียน 🙋‍♂️</h2></div>
                                                    <div className="bg-slate-100 p-1.5 rounded-xl flex shadow-inner"><button onClick={() => setStudentInputMode('single')} className={`px-4 py-1.5 text-xs font-bold rounded-lg transition-colors ${studentInputMode === 'single' ? 'bg-white text-indigo-600 shadow-sm border border-slate-200' : 'text-slate-500 hover:text-slate-700'}`}>ทีละคน</button><button onClick={() => setStudentInputMode('bulk')} className={`px-4 py-1.5 text-xs font-bold rounded-lg transition-colors ${studentInputMode === 'bulk' ? 'bg-white text-emerald-600 shadow-sm border border-slate-200' : 'text-slate-500 hover:text-slate-700'}`}>โยนไฟล์ CSV</button></div>
                                                </div>

                                                {studentInputMode === 'single' ? (
                                                    <form onSubmit={handleAddStudent} className="space-y-5 bg-slate-50 p-8 rounded-3xl border border-slate-100 shadow-inner">
                                                        <div><input type="text" required value={newStudentUsername} onChange={e => setNewStudentUsername(e.target.value)} className="w-full px-5 py-3.5 bg-white border-2 border-slate-200 rounded-xl focus:border-indigo-400 outline-none font-bold text-slate-700 text-sm transition-colors shadow-sm" placeholder="รหัสประจำตัว (Username)" /></div>
                                                        <div><input type="text" required value={newStudentName} onChange={e => setNewStudentName(e.target.value)} className="w-full px-5 py-3.5 bg-white border-2 border-slate-200 rounded-xl focus:border-indigo-400 outline-none font-bold text-slate-700 text-sm transition-colors shadow-sm" placeholder="ชื่อ-สกุล" /></div>
                                                        <div className="flex gap-4"><div className="flex-1"><input type="text" value={newStudentGrade} onChange={e => setNewStudentGrade(e.target.value)} className="w-full px-5 py-3.5 bg-white border-2 border-slate-200 rounded-xl focus:border-indigo-400 outline-none font-bold text-slate-700 text-sm transition-colors shadow-sm" placeholder="ชั้น (เช่น ม.4)" /></div><div className="flex-1"><input type="text" value={newStudentRoom} onChange={e => setNewStudentRoom(e.target.value)} className="w-full px-5 py-3.5 bg-white border-2 border-slate-200 rounded-xl focus:border-indigo-400 outline-none font-bold text-slate-700 text-sm transition-colors shadow-sm" placeholder="ห้อง (เช่น 1)" /></div></div>
                                                        <div><input type="text" required value={newStudentPassword} onChange={e => setNewStudentPassword(e.target.value)} className="w-full px-5 py-3.5 bg-white border-2 border-slate-200 rounded-xl focus:border-indigo-400 outline-none font-bold text-slate-700 text-sm transition-colors shadow-sm" placeholder="ตั้งรหัสผ่านเริ่มต้น" /></div>
                                                        <button type="submit" disabled={isLoading} className="btn-3d w-full py-4 mt-4 primary-gradient text-white rounded-xl font-black text-sm shadow-[0_4px_0_#3730a3]">{isLoading ? <div className="dot-pulse"><div></div><div></div><div></div></div> : 'บันทึกเลย 💾'}</button>
                                                    </form>
                                                ) : (
                                                    <div className="bg-slate-50 p-8 rounded-3xl border border-slate-100 text-center shadow-inner">
                                                        <button onClick={handleDownloadTemplate} className="w-full py-4 mb-5 bg-white text-indigo-600 font-bold text-sm rounded-xl border-2 border-indigo-100 hover:bg-indigo-50 transition-colors btn-3d shadow-[0_3px_0_#e0e7ff]"><i className="fa-solid fa-download mr-2"></i> 1. โหลดไฟล์แบบฟอร์ม (Excel)</button>
                                                        <div className="w-full p-8 border-4 border-dashed border-slate-200 rounded-2xl mb-6 bg-white relative hover:border-emerald-300 hover:bg-emerald-50 transition-colors group">
                                                            <input type="file" accept=".csv" onChange={(e) => { const file = e.target.files[0]; if(file){ const reader = new FileReader(); reader.onload=(event)=>setCsvData(event.target.result); reader.readAsText(file); } }} className="absolute inset-0 w-full h-full opacity-0 cursor-pointer" />
                                                            <div className={`text-5xl mb-3 transition-transform group-hover:-translate-y-1 ${csvData ? 'text-emerald-400' : 'text-slate-300'}`}><i className="fa-solid fa-file-csv"></i></div>
                                                            <p className="text-sm font-bold text-slate-500">{csvData ? 'ไฟล์พร้อมแล้วจ้า ✅' : '2. ลากไฟล์ CSV มาวางตรงนี้'}</p>
                                                        </div>
                                                        <button onClick={handleBulkImport} disabled={!csvData || isLoading} className={`btn-3d w-full py-4 text-white rounded-xl font-black text-base transition-colors ${!csvData || isLoading ? 'bg-slate-300 shadow-[0_4px_0_#cbd5e1]' : 'bg-emerald-500 shadow-[0_4px_0_#059669]'}`}>{isLoading ? <div className="dot-pulse"><div></div><div></div><div></div></div> : '3. เริ่มนำเข้าข้อมูล 🚀'}</button>
                                                    </div>
                                                )}
                                            </div>
                                        )}
                                    </>
                                )}
                            </>
                        )}
                    </div>
                    {showProfile && <ProfileModal user={user} onClose={() => setShowProfile(false)} onUpdateProfile={onUpdateUser} onShowNotification={onShowNotification} />}
                    {previewImage && <ImagePreviewModal src={previewImage} onClose={() => setPreviewImage(null)} />}
                </div>
            );
        };

        // ---------------------------------------------------------
        // MAIN APP
        // ---------------------------------------------------------
        const App = () => {
            const [user, setUser] = useState(null); 
            const [exams, setExams] = useState([]); 
            const [currentView, setCurrentView] = useState('login'); 
            const [activeExam, setActiveExam] = useState(null); 
            const [activeSession, setActiveSession] = useState(null); 
            const [showInstructions, setShowInstructions] = useState(false); 
            const [notification, setNotification] = useState({ message: '', type: '' }); 
            const [isReady, setIsReady] = useState(false);
            const [isRefreshing, setIsRefreshing] = useState(false);

            // ตรวจสอบ Session เก่าตอนเปิดเว็บ
            useEffect(() => { 
                const savedUser = localStorage.getItem('exam_user_session');
                if (savedUser) {
                    try {
                        const parsedUser = JSON.parse(savedUser);
                        setUser(parsedUser);
                        if (parsedUser.role === 'teacher') {
                            setCurrentView('teacher_dashboard');
                        } else {
                            if (!parsedUser.profilePic) setCurrentView('onboarding');
                            else setCurrentView('dashboard');
                        }
                    } catch (e) {
                        localStorage.removeItem('exam_user_session');
                    }
                }
                setIsReady(true); 
            }, []);

            const showNotification = (message, type = 'success') => { setNotification({ message, type }); setTimeout(() => setNotification({ message: '', type: '' }), 4000); };
            
            const fetchExamsData = async (u) => { 
                try { 
                    const data = await api.getExams(u.id, u.role); 
                    setExams(data); 
                } catch(e){ 
                    console.error(e); 
                } 
            };

            useEffect(() => { 
                if (user && user.role === 'student' && currentView === 'dashboard') { 
                    fetchExamsData(user); 
                } 
            }, [user, currentView]);

            const handleRefreshData = async (triggerLoader = false) => {
                if(!user) return;
                if(triggerLoader) setIsRefreshing(true);
                await fetchExamsData(user);
                if(triggerLoader) setIsRefreshing(false);
            };

            const handleLogin = (loggedInUser) => { 
                setUser(loggedInUser); 
                localStorage.setItem('exam_user_session', JSON.stringify(loggedInUser)); // บันทึก Session
                if (loggedInUser.role === 'student' && !loggedInUser.profilePic) { setCurrentView('onboarding'); } 
                else { setShowInstructions(true); } 
            };
            const proceedToDashboard = () => { setShowInstructions(false); if (user.role === 'teacher') setCurrentView('teacher_dashboard'); else setCurrentView('dashboard'); };
            
            const handleLogout = () => { 
                setUser(null); 
                localStorage.removeItem('exam_user_session'); // ล้าง Session
                setCurrentView('login'); 
                setActiveExam(null); 
                setActiveSession(null); 
                setShowInstructions(false); 
            };
            
            const handleUpdateUser = (updatedUser) => { 
                setUser(updatedUser); 
                localStorage.setItem('exam_user_session', JSON.stringify(updatedUser)); // อัปเดต Session
            };
            const handleEnterExamRoom = (exam) => { setActiveExam(exam); setActiveSession(exam.session || null); setCurrentView('exam'); };
            const handleStartSession = async (exam) => { const session = await api.startSession(user.id, exam.id); setActiveSession(session); return session; };

            if (!isReady) return <GlobalLoader message="กำลังปลุกระบบ..." />;

            return (
                <div className="min-h-screen">
                    <Notification message={notification.message} type={notification.type} onClose={() => setNotification({ message: '', type: '' })} />
                    {currentView === 'login' && !showInstructions && <LoginView onLogin={handleLogin} />}
                    {currentView === 'onboarding' && user && <OnboardingView user={user} onShowNotification={showNotification} onComplete={(updatedUser) => { setUser(updatedUser); setCurrentView('login'); setShowInstructions(true); }} />}
                    {showInstructions && user && currentView !== 'onboarding' && <InstructionModal role={user.role} onAccept={proceedToDashboard} />}
                    {currentView === 'teacher_dashboard' && user?.role === 'teacher' && !showInstructions && <TeacherDashboardView user={user} onLogout={handleLogout} onShowNotification={showNotification} onUpdateUser={handleUpdateUser} onRefresh={setIsRefreshing} isRefreshing={isRefreshing} />}
                    {currentView === 'dashboard' && user?.role === 'student' && !showInstructions && <DashboardView user={user} exams={exams} onStartExam={handleEnterExamRoom} onLogout={handleLogout} onShowNotification={showNotification} onUpdateUser={handleUpdateUser} onRefresh={handleRefreshData} isRefreshing={isRefreshing} />}
                    {currentView === 'exam' && user && activeExam && !showInstructions && <ExamRoomView user={user} exam={activeExam} session={activeSession} onStartSession={handleStartSession} onBack={() => { setCurrentView('dashboard'); fetchExamsData(user); setActiveExam(null); setActiveSession(null); }} onShowNotification={showNotification} />}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
